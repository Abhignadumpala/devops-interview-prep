<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#10b981"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs>
<rect width="960" height="460" rx="20" fill="url(#bg)"/>
<circle cx="70" cy="62" r="30" fill="url(#t)"/><text x="70" y="73" font-size="30" text-anchor="middle">🛰️</text>
<text x="120" y="75" font-size="38" font-weight="800" fill="url(#t)">What is Node Exporter?</text>
<text x="122" y="104" font-size="16" fill="#cbd5e1">An agent installed on every server we want to monitor — no Node Exporter, no metrics</text>
<rect x="30" y="130" width="900" height="48" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#e6522c" stroke-opacity="0.6"/>
<rect x="30" y="130" width="8" height="48" rx="4" fill="#e6522c"/>
<text x="58" y="162" font-size="22">🏷️</text>
<text x="96" y="161" font-size="19" font-weight="700" fill="#e6522c">Tool</text>
<text x="260" y="161" font-size="19" fill="#f1f5f9">Node Exporter</text>
<rect x="30" y="188" width="900" height="48" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#f59e0b" stroke-opacity="0.6"/>
<rect x="30" y="188" width="8" height="48" rx="4" fill="#f59e0b"/>
<text x="58" y="220" font-size="22">🔗</text>
<text x="96" y="219" font-size="19" font-weight="700" fill="#f59e0b">Type</text>
<text x="260" y="219" font-size="19" fill="#f1f5f9">Data source — an agent on each server</text>
<rect x="30" y="246" width="900" height="48" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#10b981" stroke-opacity="0.6"/>
<rect x="30" y="246" width="8" height="48" rx="4" fill="#10b981"/>
<text x="58" y="278" font-size="22">🎯</text>
<text x="96" y="277" font-size="19" font-weight="700" fill="#10b981">Purpose</text>
<text x="260" y="277" font-size="19" fill="#f1f5f9">Send metrics from worker node → Prometheus</text>
<rect x="30" y="304" width="900" height="48" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#3b82f6" stroke-opacity="0.6"/>
<rect x="30" y="304" width="8" height="48" rx="4" fill="#3b82f6"/>
<text x="58" y="336" font-size="22">📊</text>
<text x="96" y="335" font-size="19" font-weight="700" fill="#3b82f6">Collects</text>
<text x="260" y="335" font-size="19" fill="#f1f5f9">CPU · RAM · Disk · Network</text>
<rect x="30" y="362" width="900" height="48" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#8b5cf6" stroke-opacity="0.6"/>
<rect x="30" y="362" width="8" height="48" rx="4" fill="#8b5cf6"/>
<text x="58" y="394" font-size="22">🔌</text>
<text x="96" y="393" font-size="19" font-weight="700" fill="#8b5cf6">Port</text>
<text x="260" y="393" font-size="19" fill="#f1f5f9">9100</text>
</svg>