name: Continuous Integration

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Environment
        id: setup
        uses: ./.github/workflows/securepipeline # FOLDER path, not .../action.yml

      - name: Run Tests
        run: npm test
        shell: bash
