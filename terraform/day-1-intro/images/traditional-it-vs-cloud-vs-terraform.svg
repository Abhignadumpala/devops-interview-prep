<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7b42bc"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<rect width="1100" height="600" rx="20" fill="url(#bg)"/>
<text x="40" y="62" font-size="34" font-weight="800" fill="url(#t)">Traditional IT vs Cloud vs Terraform</text>
<text x="42" y="92" font-size="16" fill="#cbd5e1">How we get servers: buy hardware → click in a console → write code</text>

<!-- Traditional IT -->
<rect x="30" y="125" width="320" height="410" rx="14" fill="#fff" fill-opacity="0.06" stroke="#f87171"/>
<text x="50" y="160" font-size="22" font-weight="800" fill="#f87171">1. Traditional IT</text>
<text x="50" y="184" font-size="14" fill="#cbd5e1">own data center (on-premise)</text>
<text x="50" y="225" font-size="15" fill="#e2e8f0">🏢 Buy servers, racks, network</text>
<text x="50" y="255" font-size="15" fill="#e2e8f0">🔌 Power, cooling, security</text>
<text x="50" y="285" font-size="15" fill="#e2e8f0">👷 Team sets up by hand</text>
<text x="50" y="315" font-size="15" fill="#e2e8f0">💰 Big cost up front</text>
<rect x="50" y="440" width="280" height="75" rx="10" fill="#f87171" fill-opacity="0.15"/>
<text x="66" y="470" font-size="16" font-weight="700" fill="#f87171">⏱ Weeks to months</text>
<text x="66" y="496" font-size="14" fill="#e2e8f0">hard to scale, slow to change</text>

<line x1="355" y1="330" x2="385" y2="330" stroke="#cbd5e1" stroke-width="2" marker-end="url(#a)"/>

<!-- Cloud -->
<rect x="390" y="125" width="320" height="410" rx="14" fill="#fff" fill-opacity="0.06" stroke="#f59e0b"/>
<text x="410" y="160" font-size="22" font-weight="800" fill="#f59e0b">2. Cloud (console)</text>
<text x="410" y="184" font-size="14" fill="#cbd5e1">AWS · Azure · GCP</text>
<text x="410" y="225" font-size="15" fill="#e2e8f0">☁️ Rent servers, pay as you use</text>
<text x="410" y="255" font-size="15" fill="#e2e8f0">🖱 Click in the AWS console</text>
<text x="410" y="285" font-size="15" fill="#e2e8f0">😓 Manual → human mistakes</text>
<text x="410" y="315" font-size="15" fill="#e2e8f0">🔁 Repeat clicks for dev/stage/prod</text>
<text x="410" y="345" font-size="15" fill="#e2e8f0">❓ No record of who changed what</text>
<rect x="410" y="440" width="280" height="75" rx="10" fill="#f59e0b" fill-opacity="0.15"/>
<text x="426" y="470" font-size="16" font-weight="700" fill="#f59e0b">⏱ Minutes</text>
<text x="426" y="496" font-size="14" fill="#e2e8f0">fast, but manual &amp; not repeatable</text>

<line x1="715" y1="330" x2="745" y2="330" stroke="#cbd5e1" stroke-width="2" marker-end="url(#a)"/>

<!-- Terraform -->
<rect x="750" y="125" width="320" height="410" rx="14" fill="#fff" fill-opacity="0.06" stroke="#10b981"/>
<text x="770" y="160" font-size="22" font-weight="800" fill="#10b981">3. Terraform (IaC)</text>
<text x="770" y="184" font-size="14" fill="#cbd5e1">infrastructure written as code</text>
<rect x="770" y="200" width="280" height="62" rx="8" fill="#000" fill-opacity="0.35"/>
<text x="784" y="224" font-size="13" fill="#a78bfa" font-family="Consolas, monospace">resource "aws_instance" "web" {</text>
<text x="784" y="246" font-size="13" fill="#e2e8f0" font-family="Consolas, monospace">  instance_type = "t3.micro" }</text>
<text x="770" y="292" font-size="15" fill="#e2e8f0">📄 Code in Git → reviewed</text>
<text x="770" y="322" font-size="15" fill="#e2e8f0">♻️ Same code → dev, stage, prod</text>
<text x="770" y="352" font-size="15" fill="#e2e8f0">⚡ plan → apply → destroy</text>
<text x="770" y="382" font-size="15" fill="#e2e8f0">🌍 AWS, Azure, GCP, K8s…</text>
<rect x="770" y="440" width="280" height="75" rx="10" fill="#10b981" fill-opacity="0.15"/>
<text x="786" y="470" font-size="16" font-weight="700" fill="#10b981">⏱ Minutes, every time</text>
<text x="786" y="496" font-size="14" fill="#e2e8f0">automated, repeatable, tracked</text>

<text x="550" y="572" font-size="15" fill="#cbd5e1" text-anchor="middle">Cloud gave us servers fast. Terraform lets us create them the same way every time — with code.</text>
</svg>
