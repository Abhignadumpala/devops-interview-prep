<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect width="1000" height="380" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#111827">What happens to every request before it is saved</text>

  <rect x="20" y="120" width="110" height="80" rx="10" fill="#ffffff" stroke="#111827"/>
  <text x="75" y="152" text-anchor="middle" font-size="14" font-weight="bold" fill="#111827">kubectl</text>
  <text x="75" y="172" text-anchor="middle" font-size="12" fill="#111827">apply / run</text>
  <text x="75" y="188" text-anchor="middle" font-size="12" fill="#111827">CI, Argo CD</text>

  <rect x="150" y="70" width="700" height="190" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="166" y="92" font-size="13" font-weight="bold" fill="#475569">API server</text>

  <rect x="165" y="115" width="120" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="225" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">1. AuthN</text>
  <text x="225" y="166" text-anchor="middle" font-size="12" fill="#1e3a8a">Who are you?</text>
  <text x="225" y="184" text-anchor="middle" font-size="11" fill="#1e3a8a">(IAM, certs, tokens)</text>

  <rect x="300" y="115" width="120" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="360" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">2. AuthZ</text>
  <text x="360" y="166" text-anchor="middle" font-size="12" fill="#1e3a8a">Are you allowed?</text>
  <text x="360" y="184" text-anchor="middle" font-size="11" fill="#1e3a8a">(RBAC)</text>

  <rect x="435" y="105" width="130" height="110" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="500" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">3. Mutating</text>
  <text x="500" y="153" text-anchor="middle" font-size="14" font-weight="bold" fill="#9a3412">admission</text>
  <text x="500" y="176" text-anchor="middle" font-size="12" fill="#9a3412">CHANGES the object</text>
  <text x="500" y="196" text-anchor="middle" font-size="11" fill="#9a3412">add defaults, sidecars</text>

  <rect x="580" y="115" width="110" height="90" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="635" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">4. Schema</text>
  <text x="635" y="166" text-anchor="middle" font-size="12" fill="#334155">valid YAML</text>
  <text x="635" y="184" text-anchor="middle" font-size="12" fill="#334155">fields?</text>

  <rect x="705" y="105" width="130" height="110" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="770" y="135" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">5. Validating</text>
  <text x="770" y="153" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">admission</text>
  <text x="770" y="176" text-anchor="middle" font-size="12" fill="#991b1b">ACCEPT or REJECT</text>
  <text x="770" y="196" text-anchor="middle" font-size="11" fill="#991b1b">follows the rules?</text>

  <rect x="870" y="120" width="110" height="80" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="925" y="155" text-anchor="middle" font-size="15" font-weight="bold" fill="#065f46">6. etcd</text>
  <text x="925" y="176" text-anchor="middle" font-size="12" fill="#065f46">saved → runs</text>

  <line x1="130" y1="160" x2="163" y2="160" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="285" y1="160" x2="298" y2="160" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="420" y1="160" x2="433" y2="160" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="565" y1="160" x2="578" y2="160" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="690" y1="160" x2="703" y2="160" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="835" y1="160" x2="868" y2="160" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>

  <line x1="770" y1="217" x2="770" y2="292" stroke="#ef4444" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="640" y="294" width="260" height="56" rx="8" fill="#ffffff" stroke="#ef4444"/>
  <text x="770" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Rejected → error to kubectl</text>
  <text x="770" y="338" text-anchor="middle" font-size="12" fill="#991b1b">nothing is saved, nothing runs</text>

  <text x="500" y="300" text-anchor="middle" font-size="12" fill="#9a3412">e.g. NamespaceAutoProvision,</text>
  <text x="500" y="316" text-anchor="middle" font-size="12" fill="#9a3412">AlwaysPullImages, Istio sidecar</text>
  <line x1="500" y1="217" x2="500" y2="284" stroke="#f97316" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="225" y="300" text-anchor="middle" font-size="12" fill="#475569">Admission controllers = steps 3 and 5</text>
  <text x="225" y="316" text-anchor="middle" font-size="12" fill="#475569">(the "gatekeepers" of the cluster)</text>
</svg>
