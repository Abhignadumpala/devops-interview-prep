<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111827">kube-prometheus-stack on EKS</text>

  <!-- cluster box -->
  <rect x="20" y="55" width="740" height="525" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6 4"/>
  <text x="36" y="80" font-size="14" font-weight="bold" fill="#475569">EKS cluster · namespace: monitoring</text>

  <!-- sources -->
  <text x="40" y="112" font-size="13" font-weight="bold" fill="#475569">1. Metric sources (exporters)</text>
  <rect x="40" y="122" width="250" height="68" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="55" y="148" font-size="15" font-weight="bold" fill="#065f46">Node Exporter</text>
  <text x="55" y="170" font-size="12" fill="#065f46">DaemonSet · 1 Pod per node · :9100</text>
  <text x="55" y="184" font-size="12" fill="#065f46">node CPU, memory, disk, network</text>

  <rect x="40" y="202" width="250" height="68" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="55" y="228" font-size="15" font-weight="bold" fill="#065f46">kube-state-metrics</text>
  <text x="55" y="250" font-size="12" fill="#065f46">Deployment · :8080</text>
  <text x="55" y="264" font-size="12" fill="#065f46">Pod / Deployment status, restarts</text>

  <rect x="40" y="282" width="250" height="68" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="55" y="308" font-size="15" font-weight="bold" fill="#065f46">kubelet (cAdvisor)</text>
  <text x="55" y="330" font-size="12" fill="#065f46">on every node, already there</text>
  <text x="55" y="344" font-size="12" fill="#065f46">container CPU / memory per Pod</text>

  <rect x="40" y="362" width="250" height="68" rx="8" fill="#ecfdf5" stroke="#10b981"/>
  <text x="55" y="388" font-size="15" font-weight="bold" fill="#065f46">Your app /metrics</text>
  <text x="55" y="410" font-size="12" fill="#065f46">added with a ServiceMonitor</text>
  <text x="55" y="424" font-size="12" fill="#065f46">(e.g. request count)</text>

  <!-- operator -->
  <rect x="40" y="470" width="250" height="90" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="55" y="496" font-size="15" font-weight="bold" fill="#334155">Prometheus Operator</text>
  <text x="55" y="518" font-size="12" fill="#334155">Deployment · watches ServiceMonitors</text>
  <text x="55" y="534" font-size="12" fill="#334155">and writes Prometheus scrape config</text>
  <text x="55" y="550" font-size="12" fill="#334155">(no manual prometheus.yml)</text>

  <!-- prometheus -->
  <text x="370" y="112" font-size="13" font-weight="bold" fill="#475569">2. Collect + store</text>
  <rect x="370" y="210" width="190" height="130" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="465" y="242" text-anchor="middle" font-size="17" font-weight="bold" fill="#9a3412">Prometheus</text>
  <text x="465" y="266" text-anchor="middle" font-size="12" fill="#9a3412">StatefulSet · :9090</text>
  <text x="465" y="286" text-anchor="middle" font-size="12" fill="#9a3412">PULLS metrics every 30s</text>
  <text x="465" y="306" text-anchor="middle" font-size="12" fill="#9a3412">stores them (TSDB)</text>
  <text x="465" y="326" text-anchor="middle" font-size="12" fill="#9a3412">checks alert rules</text>

  <line x1="290" y1="156" x2="368" y2="236" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="290" y1="236" x2="368" y2="262" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="290" y1="316" x2="368" y2="290" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="290" y1="396" x2="368" y2="316" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="300" y="200" font-size="11" fill="#374151">scrape</text>
  <line x1="290" y1="500" x2="440" y2="342" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="380" y="430" font-size="11" fill="#64748b">config</text>

  <!-- alertmanager -->
  <rect x="370" y="440" width="190" height="80" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="465" y="470" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">Alertmanager</text>
  <text x="465" y="492" text-anchor="middle" font-size="12" fill="#991b1b">StatefulSet · :9093</text>
  <text x="465" y="508" text-anchor="middle" font-size="12" fill="#991b1b">groups + sends alerts</text>
  <line x1="510" y1="342" x2="510" y2="438" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="518" y="395" font-size="11" fill="#374151">alert fired</text>

  <!-- grafana -->
  <text x="600" y="112" font-size="13" font-weight="bold" fill="#475569">3. Show</text>
  <rect x="600" y="210" width="140" height="130" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="670" y="242" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a8a">Grafana</text>
  <text x="670" y="266" text-anchor="middle" font-size="12" fill="#1e3a8a">Deployment</text>
  <text x="670" y="284" text-anchor="middle" font-size="12" fill="#1e3a8a">Service :80</text>
  <text x="670" y="306" text-anchor="middle" font-size="12" fill="#1e3a8a">dashboards</text>
  <text x="670" y="324" text-anchor="middle" font-size="12" fill="#1e3a8a">(PromQL queries)</text>
  <line x1="598" y1="275" x2="562" y2="275" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="566" y="266" font-size="11" fill="#374151">query</text>

  <!-- outside -->
  <rect x="800" y="215" width="180" height="120" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="890" y="245" text-anchor="middle" font-size="15" font-weight="bold" fill="#713f12">AWS Load Balancer</text>
  <text x="890" y="267" text-anchor="middle" font-size="12" fill="#713f12">created by Service</text>
  <text x="890" y="283" text-anchor="middle" font-size="12" fill="#713f12">type: LoadBalancer</text>
  <text x="890" y="305" text-anchor="middle" font-size="12" fill="#713f12">http://xxxx.elb</text>
  <text x="890" y="321" text-anchor="middle" font-size="12" fill="#713f12">.amazonaws.com</text>
  <line x1="798" y1="275" x2="742" y2="275" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="820" y="110" width="140" height="60" rx="10" fill="#ffffff" stroke="#111827"/>
  <text x="890" y="137" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">You (browser)</text>
  <text x="890" y="157" text-anchor="middle" font-size="12" fill="#111827">login: admin</text>
  <line x1="890" y1="172" x2="890" y2="213" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="800" y="440" width="180" height="80" rx="10" fill="#ffffff" stroke="#111827"/>
  <text x="890" y="470" text-anchor="middle" font-size="15" font-weight="bold" fill="#111827">Slack / Email</text>
  <text x="890" y="492" text-anchor="middle" font-size="12" fill="#111827">PagerDuty</text>
  <line x1="562" y1="480" x2="798" y2="480" stroke="#374151" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
