<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Arial, Helvetica, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#111827">How each strategy moves users from v1 to v2</text>
  <rect x="330" y="46" width="16" height="16" rx="3" fill="#bfdbfe" stroke="#2563eb"/><text x="352" y="59" font-size="13" fill="#111827">v1 (old)</text>
  <rect x="440" y="46" width="16" height="16" rx="3" fill="#bbf7d0" stroke="#16a34a"/><text x="462" y="59" font-size="13" fill="#111827">v2 (new)</text>
  <rect x="550" y="46" width="16" height="16" rx="3" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="3 2"/><text x="572" y="59" font-size="13" fill="#111827">no Pod (down)</text>

  <!-- Recreate -->
  <rect x="20" y="80" width="470" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="108" font-size="17" font-weight="bold" fill="#111827">1. Recreate</text>
  <text x="40" y="128" font-size="12" fill="#475569">Stop all v1, then start all v2. Short downtime.</text>
  <g font-size="12" fill="#111827">
    <text x="40" y="168">Step 1</text><text x="40" y="218">Step 2</text><text x="40" y="268">Step 3</text>
  </g>
  <g>
    <rect x="110" y="150" width="60" height="28" rx="5" fill="#bfdbfe" stroke="#2563eb"/><rect x="180" y="150" width="60" height="28" rx="5" fill="#bfdbfe" stroke="#2563eb"/><rect x="250" y="150" width="60" height="28" rx="5" fill="#bfdbfe" stroke="#2563eb"/>
    <rect x="110" y="200" width="60" height="28" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="3 2"/><rect x="180" y="200" width="60" height="28" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="3 2"/><rect x="250" y="200" width="60" height="28" rx="5" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="3 2"/>
    <rect x="110" y="250" width="60" height="28" rx="5" fill="#bbf7d0" stroke="#16a34a"/><rect x="180" y="250" width="60" height="28" rx="5" fill="#bbf7d0" stroke="#16a34a"/><rect x="250" y="250" width="60" height="28" rx="5" fill="#bbf7d0" stroke="#16a34a"/>
  </g>
  <text x="325" y="219" font-size="13" font-weight="bold" fill="#dc2626">← downtime</text>
  <text x="40" y="312" font-size="12" fill="#475569">Use: dev/test, or when v1 and v2 can't run together.</text>

  <!-- Rolling -->
  <rect x="510" y="80" width="470" height="250" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="530" y="108" font-size="17" font-weight="bold" fill="#111827">2. Rolling update (Kubernetes default)</text>
  <text x="530" y="128" font-size="12" fill="#475569">Replace Pods a few at a time. No downtime.</text>
  <g font-size="12" fill="#111827">
    <text x="530" y="168">Step 1</text><text x="530" y="218">Step 2</text><text x="530" y="268">Step 3</text>
  </g>
  <rect x="600" y="150" width="60" height="28" rx="5" fill="#bbf7d0" stroke="#16a34a"/><rect x="670" y="150" width="60" height="28" rx="5" fill="#bfdbfe" stroke="#2563eb"/><rect x="740" y="150" width="60" height="28" rx="5" fill="#bfdbfe" stroke="#2563eb"/>
  <rect x="600" y="200" width="60" height="28" rx="5" fill="#bbf7d0" stroke="#16a34a"/><rect x="670" y="200" width="60" height="28" rx="5" fill="#bbf7d0" stroke="#16a34a"/><rect x="740" y="200" width="60" height="28" rx="5" fill="#bfdbfe" stroke="#2563eb"/>
  <rect x="600" y="250" width="60" height="28" rx="5" fill="#bbf7d0" stroke="#16a34a"/><rect x="670" y="250" width="60" height="28" rx="5" fill="#bbf7d0" stroke="#16a34a"/><rect x="740" y="250" width="60" height="28" rx="5" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="530" y="312" font-size="12" fill="#475569">Use: most stateless apps. Old and new run together.</text>

  <!-- Blue-green -->
  <rect x="20" y="350" width="470" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="40" y="378" font-size="17" font-weight="bold" fill="#111827">3. Blue-green</text>
  <text x="40" y="398" font-size="12" fill="#475569">Run a full copy of v2 next to v1, test it, then switch 100%.</text>
  <rect x="40" y="470" width="90" height="50" rx="8" fill="#ffffff" stroke="#111827"/>
  <text x="85" y="492" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Users</text>
  <text x="85" y="509" text-anchor="middle" font-size="11" fill="#111827">Service / LB</text>
  <rect x="250" y="420" width="220" height="60" rx="8" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="360" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">Blue = v1 (live)</text>
  <text x="360" y="466" text-anchor="middle" font-size="11" fill="#1e3a8a">3 Pods</text>
  <rect x="250" y="510" width="220" height="60" rx="8" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="360" y="536" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">Green = v2 (idle, tested)</text>
  <text x="360" y="556" text-anchor="middle" font-size="11" fill="#14532d">3 Pods</text>
  <line x1="130" y1="485" x2="246" y2="452" stroke="#374151" stroke-width="2" marker-end="url(#a)"/>
  <line x1="130" y1="505" x2="246" y2="538" stroke="#374151" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="140" y="458" font-size="11" fill="#111827">100% now</text>
  <text x="140" y="548" font-size="11" fill="#111827">switch</text>
  <text x="40" y="600" font-size="12" fill="#475569">Rollback = switch back. Cost: 2x Pods during release.</text>

  <!-- Canary -->
  <rect x="510" y="350" width="470" height="270" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="530" y="378" font-size="17" font-weight="bold" fill="#111827">4. Canary</text>
  <text x="530" y="398" font-size="12" fill="#475569">Send a small % of users to v2, watch metrics, then grow.</text>
  <rect x="530" y="470" width="90" height="50" rx="8" fill="#ffffff" stroke="#111827"/>
  <text x="575" y="492" text-anchor="middle" font-size="13" font-weight="bold" fill="#111827">Users</text>
  <text x="575" y="509" text-anchor="middle" font-size="11" fill="#111827">ALB / Ingress</text>
  <rect x="740" y="420" width="220" height="60" rx="8" fill="#bfdbfe" stroke="#2563eb"/>
  <text x="850" y="446" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">v1 (stable)</text>
  <text x="850" y="466" text-anchor="middle" font-size="11" fill="#1e3a8a">90% of traffic</text>
  <rect x="740" y="510" width="220" height="60" rx="8" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="850" y="536" text-anchor="middle" font-size="14" font-weight="bold" fill="#14532d">v2 (canary)</text>
  <text x="850" y="556" text-anchor="middle" font-size="11" fill="#14532d">10% of traffic</text>
  <line x1="620" y1="485" x2="736" y2="452" stroke="#374151" stroke-width="4" marker-end="url(#a)"/>
  <line x1="620" y1="505" x2="736" y2="538" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="530" y="600" font-size="12" fill="#475569">10% → 25% → 50% → 100%. Errors? Back to 0%.</text>
</svg>
