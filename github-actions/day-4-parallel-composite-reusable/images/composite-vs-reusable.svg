<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect x="2" y="2" width="896" height="616" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <text x="450" y="54" text-anchor="middle" font-size="30" font-weight="800" fill="#0f172a">Composite Action <tspan fill="#94a3b8">vs</tspan> Reusable Workflow</text>

  <!-- COMPOSITE panel -->
  <rect x="30" y="80" width="410" height="440" rx="14" fill="#fffbf5" stroke="#ea580c" stroke-width="2"/>
  <rect x="30" y="80" width="410" height="44" rx="14" fill="#ea580c"/>
  <text x="235" y="109" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Composite = reuse STEPS</text>

  <rect x="50" y="140" width="370" height="330" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="66" y="162" font-size="14" font-weight="700" fill="#334155">workflow: ci.yml</text>
  <rect x="66" y="174" width="338" height="282" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="82" y="196" font-size="14" font-weight="700" fill="#7c2d12">job: build   (runs-on: ubuntu-latest)</text>

  <g font-family="Consolas, Menlo, monospace" font-size="13">
    <rect x="84" y="210" width="302" height="32" rx="7" fill="#ffffff" stroke="#fdba74"/>
    <text x="96" y="231" fill="#334155">- uses: actions/checkout@v4</text>
    <rect x="84" y="252" width="302" height="34" rx="7" fill="#ea580c"/>
    <text x="96" y="274" fill="#ffffff" font-weight="700">- uses: ./.github/actions/setup</text>
    <path d="M104 286 L104 300" stroke="#ea580c" stroke-width="2" stroke-dasharray="4 3"/>
    <rect x="104" y="300" width="282" height="104" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="118" y="320" fill="#7c2d12" font-weight="700" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">action.yml  (using: composite)</text>
    <text x="126" y="344" fill="#7c2d12">• setup-node + cache</text>
    <text x="126" y="366" fill="#7c2d12">• npm ci</text>
    <text x="126" y="388" fill="#7c2d12">• npm run lint</text>
    <rect x="84" y="414" width="302" height="32" rx="7" fill="#ffffff" stroke="#fdba74"/>
    <text x="96" y="435" fill="#334155">- run: npm run build</text>
  </g>
  <text x="235" y="496" text-anchor="middle" font-size="15" fill="#7c2d12">Used <tspan font-weight="700">inside a job</tspan>, under <tspan font-family="Consolas, Menlo, monospace" font-weight="700">steps:</tspan></text>

  <!-- REUSABLE panel -->
  <rect x="460" y="80" width="410" height="440" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="460" y="80" width="410" height="44" rx="14" fill="#7c3aed"/>
  <text x="665" y="109" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Reusable = reuse whole JOBS</text>

  <rect x="480" y="140" width="370" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="496" y="162" font-size="14" font-weight="700" fill="#334155">caller: deploy.yml</text>
  <g font-family="Consolas, Menlo, monospace" font-size="12" fill="#4c1d95">
    <text x="496" y="188" xml:space="preserve">jobs:</text>
    <text x="496" y="208" xml:space="preserve">  pipeline:</text>
    <text x="496" y="228" xml:space="preserve" font-weight="700">    uses: ./.github/workflows/ci.yml</text>
    <text x="496" y="248" xml:space="preserve">    secrets: inherit</text>
  </g>
  <path d="M665 270 L665 298" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="480" y="304" width="370" height="166" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="496" y="326" font-size="14" font-weight="700" fill="#4c1d95">ci.yml   (on: workflow_call)</text>
  <rect x="496" y="344" width="106" height="56" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="549" y="368" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">build</text>
  <text x="549" y="388" text-anchor="middle" font-size="11" fill="#1e3a8a">own runner</text>
  <path d="M602 372 L612 372" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="616" y="344" width="106" height="56" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="669" y="368" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">test</text>
  <text x="669" y="388" text-anchor="middle" font-size="11" fill="#7c2d12">own runner</text>
  <path d="M722 372 L732 372" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="736" y="344" width="98" height="56" rx="9" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="785" y="368" text-anchor="middle" font-size="15" font-weight="700" fill="#831843">deploy</text>
  <text x="785" y="388" text-anchor="middle" font-size="11" fill="#831843">own runner</text>
  <text x="665" y="428" text-anchor="middle" font-size="13" fill="#4c1d95">Full jobs: runs-on, needs, secrets, env</text>
  <text x="665" y="450" text-anchor="middle" font-size="13" fill="#4c1d95">Every job shows separately in the logs</text>
  <text x="665" y="496" text-anchor="middle" font-size="15" fill="#4c1d95">Used <tspan font-weight="700">as a job</tspan>, with <tspan font-family="Consolas, Menlo, monospace" font-weight="700">jobs.&lt;id&gt;.uses:</tspan></text>

  <rect x="30" y="540" width="840" height="58" rx="12" fill="#3b0764"/>
  <text x="450" y="575" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Composite = <tspan fill="#fdba74">STEP level</tspan>  ·  Reusable workflow = <tspan fill="#d8b4fe">JOB level</tspan></text>
</svg>
