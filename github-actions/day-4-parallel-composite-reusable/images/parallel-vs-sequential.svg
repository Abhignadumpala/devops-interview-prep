<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker></defs>
  <rect x="2" y="2" width="896" height="636" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="450" y="54" text-anchor="middle" font-size="30" font-weight="800" fill="#0f172a">Parallel <tspan fill="#94a3b8">vs</tspan> Sequential Builds</text>

  <!-- PARALLEL panel -->
  <rect x="30" y="80" width="410" height="360" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="30" y="80" width="410" height="44" rx="14" fill="#16a34a"/>
  <text x="235" y="109" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Parallel = Run together</text>

  <rect x="50" y="218" width="90" height="44" rx="10" fill="#334155"/>
  <text x="95" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">push</text>
  <path d="M140 240 L194 155" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M140 240 L194 240" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
  <path d="M140 240 L194 325" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="200" y="130" width="200" height="50" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="300" y="161" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">build</text>
  <rect x="200" y="215" width="200" height="50" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="300" y="246" text-anchor="middle" font-size="17" font-weight="700" fill="#7c2d12">test</text>
  <rect x="200" y="300" width="200" height="50" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="300" y="331" text-anchor="middle" font-size="17" font-weight="700" fill="#4c1d95">security</text>

  <text x="235" y="390" text-anchor="middle" font-size="15" fill="#14532d">No <tspan font-family="Consolas, Menlo, monospace" font-weight="700">needs:</tspan> between the jobs</text>
  <text x="235" y="416" text-anchor="middle" font-size="15" fill="#14532d">→ GitHub starts them <tspan font-weight="700">all at the same time</tspan></text>

  <!-- SEQUENTIAL panel -->
  <rect x="460" y="80" width="410" height="360" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="460" y="80" width="410" height="44" rx="14" fill="#2563eb"/>
  <text x="665" y="109" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Sequential = One after another</text>

  <rect x="478" y="150" width="104" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="530" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">build</text>
  <path d="M582 178 L612 178" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="618" y="150" width="104" height="56" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="670" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#7c2d12">test</text>
  <path d="M722 178 L752 178" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="758" y="150" width="96" height="56" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="806" y="184" text-anchor="middle" font-size="17" font-weight="700" fill="#831843">deploy</text>

  <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#334155" text-anchor="middle">
    <text x="670" y="230">needs: build</text>
    <text x="806" y="230">needs: test</text>
  </g>

  <text x="665" y="286" text-anchor="middle" font-size="15" fill="#1e3a8a">Each job <tspan font-weight="700">waits</tspan> for the one before it</text>
  <rect x="490" y="306" width="350" height="40" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="665" y="332" text-anchor="middle" font-size="15" font-weight="700" fill="#991b1b">❌ test fails → deploy is skipped</text>
  <text x="665" y="390" text-anchor="middle" font-size="15" fill="#1e3a8a">Use when a job needs another's result</text>
  <text x="665" y="416" text-anchor="middle" font-size="15" fill="#1e3a8a">(e.g. deploy needs the build artifact)</text>

  <!-- TIMELINE -->
  <text x="30" y="482" font-size="16" font-weight="800" fill="#0f172a">Total pipeline time</text>
  <text x="30" y="514" font-size="14" font-weight="700" fill="#14532d">Parallel</text>
  <rect x="150" y="496" width="190" height="26" rx="7" fill="#4ade80"/>
  <text x="350" y="514" font-size="15" font-weight="700" fill="#14532d">= slowest job only ⚡</text>
  <text x="30" y="552" font-size="14" font-weight="700" fill="#1e3a8a">Sequential</text>
  <rect x="150" y="534" width="186" height="26" rx="7" fill="#93c5fd"/>
  <text x="243" y="552" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">build</text>
  <rect x="340" y="534" width="186" height="26" rx="7" fill="#fdba74"/>
  <text x="433" y="552" text-anchor="middle" font-size="13" font-weight="700" fill="#7c2d12">test</text>
  <rect x="530" y="534" width="186" height="26" rx="7" fill="#f9a8d4"/>
  <text x="623" y="552" text-anchor="middle" font-size="13" font-weight="700" fill="#831843">deploy</text>
  <text x="726" y="552" font-size="15" font-weight="700" fill="#1e3a8a">= all added up</text>

  <rect x="30" y="576" width="840" height="46" rx="12" fill="#1e3a8a"/>
  <text x="450" y="606" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Independent jobs → <tspan fill="#86efac">parallel</tspan>  ·  Dependent jobs → <tspan fill="#fde047">sequential with needs:</tspan></text>
</svg>
