<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="r" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
  <rect x="2" y="2" width="896" height="556" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <text x="450" y="58" font-size="34" font-weight="800" text-anchor="middle"><tspan fill="#2563eb">GitHub Actions</tspan><tspan fill="#0f172a"> vs </tspan><tspan fill="#dc2626">Jenkins</tspan></text>
  <rect x="40" y="86" width="370" height="48" rx="24" fill="#2563eb"/>
  <text x="225" y="118" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">GitHub Actions</text>
  <rect x="40" y="152" width="370" height="52" rx="12" fill="#eff6ff"/>
  <circle cx="68" cy="178" r="15" fill="#2563eb"/>
  <text x="68" y="184" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">✔</text>
  <text x="96" y="175" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="start">Built into GitHub</text>
  <text x="96" y="195" font-size="13" font-weight="400" fill="#1e3a8a" text-anchor="start">nothing to install</text>
  <rect x="40" y="214" width="370" height="52" rx="12" fill="#eff6ff"/>
  <circle cx="68" cy="240" r="15" fill="#2563eb"/>
  <text x="68" y="246" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">✔</text>
  <text x="96" y="237" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="start">YAML pipeline</text>
  <text x="96" y="257" font-size="13" font-weight="400" fill="#1e3a8a" text-anchor="start">in .github/workflows/</text>
  <rect x="40" y="276" width="370" height="52" rx="12" fill="#eff6ff"/>
  <circle cx="68" cy="302" r="15" fill="#2563eb"/>
  <text x="68" y="308" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">✔</text>
  <text x="96" y="299" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="start">GitHub-hosted runners</text>
  <text x="96" y="319" font-size="13" font-weight="400" fill="#1e3a8a" text-anchor="start">scale automatically</text>
  <rect x="40" y="338" width="370" height="52" rx="12" fill="#eff6ff"/>
  <circle cx="68" cy="364" r="15" fill="#2563eb"/>
  <text x="68" y="370" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">✔</text>
  <text x="96" y="361" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="start">Marketplace actions</text>
  <text x="96" y="381" font-size="13" font-weight="400" fill="#1e3a8a" text-anchor="start">ready-made steps</text>
  <rect x="40" y="400" width="370" height="52" rx="12" fill="#eff6ff"/>
  <circle cx="68" cy="426" r="15" fill="#2563eb"/>
  <text x="68" y="432" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">✔</text>
  <text x="96" y="423" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="start">Low maintenance</text>
  <text x="96" y="443" font-size="13" font-weight="400" fill="#1e3a8a" text-anchor="start">GitHub runs the servers</text>
  <rect x="490" y="86" width="370" height="48" rx="24" fill="#dc2626"/>
  <text x="675" y="118" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">Jenkins</text>
  <rect x="490" y="152" width="370" height="52" rx="12" fill="#fef2f2"/>
  <circle cx="518" cy="178" r="15" fill="#dc2626"/>
  <text x="518" y="184" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">⚙</text>
  <text x="546" y="175" font-size="16" font-weight="700" fill="#7f1d1d" text-anchor="start">Install your own server</text>
  <text x="546" y="195" font-size="13" font-weight="400" fill="#7f1d1d" text-anchor="start">controller + agents</text>
  <rect x="490" y="214" width="370" height="52" rx="12" fill="#fef2f2"/>
  <circle cx="518" cy="240" r="15" fill="#dc2626"/>
  <text x="518" y="246" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">⚙</text>
  <text x="546" y="237" font-size="16" font-weight="700" fill="#7f1d1d" text-anchor="start">Jenkinsfile pipeline</text>
  <text x="546" y="257" font-size="13" font-weight="400" fill="#7f1d1d" text-anchor="start">written in Groovy</text>
  <rect x="490" y="276" width="370" height="52" rx="12" fill="#fef2f2"/>
  <circle cx="518" cy="302" r="15" fill="#dc2626"/>
  <text x="518" y="308" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">⚙</text>
  <text x="546" y="299" font-size="16" font-weight="700" fill="#7f1d1d" text-anchor="start">You add agents</text>
  <text x="546" y="319" font-size="13" font-weight="400" fill="#7f1d1d" text-anchor="start">to scale builds</text>
  <rect x="490" y="338" width="370" height="52" rx="12" fill="#fef2f2"/>
  <circle cx="518" cy="364" r="15" fill="#dc2626"/>
  <text x="518" y="370" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">⚙</text>
  <text x="546" y="361" font-size="16" font-weight="700" fill="#7f1d1d" text-anchor="start">1,800+ plugins</text>
  <text x="546" y="381" font-size="13" font-weight="400" fill="#7f1d1d" text-anchor="start">installed on the server</text>
  <rect x="490" y="400" width="370" height="52" rx="12" fill="#fef2f2"/>
  <circle cx="518" cy="426" r="15" fill="#dc2626"/>
  <text x="518" y="432" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">⚙</text>
  <text x="546" y="423" font-size="16" font-weight="700" fill="#7f1d1d" text-anchor="start">High maintenance</text>
  <text x="546" y="443" font-size="13" font-weight="400" fill="#7f1d1d" text-anchor="start">patch, back up, upgrade</text>
  <line x1="450" y1="150" x2="450" y2="460" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="450" cy="300" r="30" fill="#0f172a"/>
  <text x="450" y="309" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">VS</text>
  <rect x="40" y="478" width="820" height="62" rx="14" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="450" y="516" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a"><tspan fill="#2563eb">GitHub Actions</tspan> for simplicity and speed · <tspan fill="#dc2626">Jenkins</tspan> for full control</text>
</svg>
