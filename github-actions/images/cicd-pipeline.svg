  <text x="84.0" y="150" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">git push</text>
  <path d="M136 143 L152 143" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="156" y="100" width="100" height="86" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="206.0" cy="100" r="14" fill="#2563eb"/>
