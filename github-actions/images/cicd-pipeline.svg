  <text x="694.0" y="160" font-size="16" font-weight="700" fill="#7f1d1d" text-anchor="middle">scan</text>
  <path d="M746 143 L762 143" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="766" y="100" width="100" height="86" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
