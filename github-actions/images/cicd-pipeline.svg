  <text x="206.0" y="150" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">Build</text>
  <path d="M258 143 L274 143" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
