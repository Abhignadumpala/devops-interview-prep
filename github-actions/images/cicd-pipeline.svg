  <text x="450.0" y="150" font-size="16" font-weight="700" fill="#164e63" text-anchor="middle">Lint</text>
  <path d="M502 143 L518 143" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="522" y="100" width="100" height="86" rx="12" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <circle cx="572.0" cy="100" r="14" fill="#0d9488"/>
  <text x="572.0" y="105.5" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="572.0" y="150" font-size="16" font-weight="700" fill="#134e4a" text-anchor="middle">Dockerize</text>
  <path d="M624 143 L640 143" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="644" y="100" width="100" height="86" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="694.0" cy="100" r="14" fill="#dc2626"/>
  <text x="694.0" y="105.5" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">6</text>
