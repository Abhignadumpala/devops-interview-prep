  <rect x="168.0" y="258" width="320" height="56" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="328.0" y="282" font-size="17" font-weight="800" fill="#7f1d1d" text-anchor="middle">Pipeline stops</text>
  <text x="328.0" y="302" font-size="14" font-weight="400" fill="#7f1d1d" text-anchor="middle">nothing is deployed</text>
  <rect x="520" y="258" width="350" height="56" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="695" y="282" font-size="17" font-weight="800" fill="#14532d" text-anchor="middle">All stages pass</text>
  <text x="695" y="302" font-size="14" font-weight="400" fill="#14532d" text-anchor="middle">the app is deployed</text>
  <rect x="30" y="334" width="840" height="46" rx="14" fill="#4c1d95"/>
  <text x="450.0" y="363.5" font-size="18" font-weight="700" text-anchor="middle"><tspan fill="#ffffff">Each stage must </tspan><tspan fill="#86efac">pass</tspan><tspan fill="#ffffff"> before the next one starts</tspan></text>
