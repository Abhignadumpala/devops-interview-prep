  <text x="328.0" y="150" font-size="16" font-weight="700" fill="#14532d" text-anchor="middle">Test</text>
  <path d="M380 143 L396 143" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="400" y="100" width="100" height="86" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <circle cx="450.0" cy="100" r="14" fill="#0891b2"/>
