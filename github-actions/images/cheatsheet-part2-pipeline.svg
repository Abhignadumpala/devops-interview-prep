  <path d="M723 447 L738 447" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="742" y="420" width="112" height="54" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="798.0" y="444.0" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">Deploy job</text>
  <text x="798.0" y="461.0" font-size="11" font-weight="400" fill="#14532d" text-anchor="middle">download-artifact</text>
  <path d="M665 478 L665 494" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="560" y="498" width="210" height="34" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="665.0" y="519.55" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="middle">You download the zip</text>
  <text x="665" y="558" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">retention-days: 7  (default 90)</text>
  <text x="665" y="584" font-size="12.5" font-weight="400" fill="#1e3a8a" text-anchor="middle">Each job = different VM → share files with artifacts</text>
  <rect x="30" y="620" width="410" height="244" rx="14" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <path d="M30 660 V634 Q30 620 44 620 H426 Q440 620 440 634 V660 Z" fill="#ca8a04"/>
  <circle cx="52" cy="640" r="12" fill="#ffffff"/>
  <text x="52" y="645" font-size="14" font-weight="800" fill="#ca8a04" text-anchor="middle">5</text>
  <text x="72" y="647" font-size="18" font-weight="800" fill="#fff" text-anchor="start">Conditions</text>
  <rect x="46" y="672" width="378" height="76" rx="8" fill="#1e293b"/>
  <text x="56" y="694" font-size="12" font-family="Consolas, Menlo, monospace" xml:space="preserve" fill="#fde68a">needs: build        # wait for build</text>
  <text x="56" y="715" font-size="12" font-family="Consolas, Menlo, monospace" xml:space="preserve" fill="#fde68a">if: github.ref == 'refs/heads/main'</text>
  <text x="56" y="736" font-size="12" font-family="Consolas, Menlo, monospace" xml:space="preserve" fill="#fde68a">    &amp;&amp; github.event_name == 'push'</text>
  <rect x="46" y="760" width="122" height="44" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="107.0" y="779.0" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">success()</text>
  <text x="107.0" y="796.0" font-size="11" font-weight="400" fill="#14532d" text-anchor="middle">default</text>
  <rect x="174" y="760" width="122" height="44" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <text x="235.0" y="779.0" font-size="13" font-weight="700" fill="#7f1d1d" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">failure()</text>
  <text x="235.0" y="796.0" font-size="11" font-weight="400" fill="#7f1d1d" text-anchor="middle">rollback</text>
  <rect x="302" y="760" width="122" height="44" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="363.0" y="779.0" font-size="13" font-weight="700" fill="#1e3a8a" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">always()</text>
  <text x="363.0" y="796.0" font-size="11" font-weight="400" fill="#1e3a8a" text-anchor="middle">cleanup</text>
  <text x="235" y="830" font-size="13" font-weight="700" fill="#713f12" text-anchor="middle">on: = does the run start?</text>
  <text x="235" y="849" font-size="13" font-weight="700" fill="#713f12" text-anchor="middle">if: = does this job / step run?</text>
  <rect x="460" y="620" width="410" height="244" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <path d="M460 660 V634 Q460 620 474 620 H856 Q870 620 870 634 V660 Z" fill="#dc2626"/>
  <circle cx="482" cy="640" r="12" fill="#ffffff"/>
  <text x="482" y="645" font-size="14" font-weight="800" fill="#dc2626" text-anchor="middle">6</text>
  <text x="502" y="647" font-size="18" font-weight="800" fill="#fff" text-anchor="start">Security</text>
  <rect x="476" y="672" width="378" height="54" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
  <rect x="476" y="672" width="8" height="54" rx="4" fill="#dc2626"/>
  <text x="496" y="695" font-size="15" font-weight="800" fill="#7f1d1d" text-anchor="start">CodeQL (SAST)</text>
  <text x="496" y="715" font-size="12.5" font-weight="400" fill="#7f1d1d" text-anchor="start">scans code without running it: SQLi, XSS</text>
  <rect x="476" y="734" width="378" height="54" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="476" y="734" width="8" height="54" rx="4" fill="#2563eb"/>
  <text x="496" y="757" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="start">Dependabot</text>
  <text x="496" y="777" font-size="12.5" font-weight="400" fill="#1e3a8a" text-anchor="start">new / secure version → opens a PR</text>
  <rect x="476" y="796" width="378" height="54" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="476" y="796" width="8" height="54" rx="4" fill="#16a34a"/>
  <text x="496" y="819" font-size="15" font-weight="800" fill="#14532d" text-anchor="start">Status checks</text>
  <text x="496" y="839" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="start">PR can't merge until CI passes</text>
  <rect x="30" y="878" width="840" height="46" rx="14" fill="#4c1d95"/>
  <text x="450.0" y="907.5" font-size="18" font-weight="700" text-anchor="middle"><tspan fill="#86efac">Matrix</tspan><tspan fill="#ffffff"> = many setups · </tspan><tspan fill="#67e8f9">Cache</tspan><tspan fill="#ffffff"> = speed · </tspan><tspan fill="#fde047">Artifact</tspan><tspan fill="#ffffff"> = output · </tspan><tspan fill="#fca5a5">CodeQL</tspan><tspan fill="#ffffff"> = secure code</tspan></text>
</svg>
