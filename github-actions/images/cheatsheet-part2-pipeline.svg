  <text x="502" y="131" font-size="18" font-weight="800" fill="#fff" text-anchor="start">Matrix Jobs</text>
  <rect x="476" y="158" width="178" height="74" rx="8" fill="#1e293b"/>
  <text x="486" y="180" font-size="11.5" font-family="Consolas, Menlo, monospace" xml:space="preserve" fill="#86efac">matrix:</text>
  <text x="486" y="200" font-size="11.5" font-family="Consolas, Menlo, monospace" xml:space="preserve" fill="#86efac">  os: [ubuntu, windows]</text>
  <text x="486" y="220" font-size="11.5" font-family="Consolas, Menlo, monospace" xml:space="preserve" fill="#86efac">  node: [20, 22, 24]</text>
