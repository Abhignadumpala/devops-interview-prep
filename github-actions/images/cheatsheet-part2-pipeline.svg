  <text x="258.0" y="537.375" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="middle">Restore ~/.npm</text>
  <path d="M309 533 L318 533" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="320" y="516" width="100" height="34" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="370.0" y="537.375" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="middle">npm ci (fast)</text>
  <text x="235" y="590" font-size="13" font-weight="600" fill="#164e63" text-anchor="middle">setup-node with cache: npm does it for you</text>
