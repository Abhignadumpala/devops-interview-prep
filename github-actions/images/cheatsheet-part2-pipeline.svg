  <text x="705.5" y="218.2" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Win 20</text>
  <rect x="740" y="197" width="59" height="34" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="769.5" y="218.2" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Win 22</text>
  <rect x="804" y="197" width="59" height="34" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="833.5" y="218.2" font-size="12" font-weight="700" fill="#1e3a8a" text-anchor="middle">Win 24</text>
  <text x="476" y="262" font-size="13" font-weight="700" fill="#7f1d1d" text-anchor="start">One by one</text>
  <rect x="570" y="249" width="240" height="18" rx="6" fill="#fca5a5"/>
  <text x="816" y="263" font-size="13" font-weight="800" fill="#7f1d1d" text-anchor="start">120 s</text>
  <text x="476" y="290" font-size="13" font-weight="700" fill="#14532d" text-anchor="start">Matrix</text>
  <rect x="570" y="277" width="64" height="18" rx="6" fill="#4ade80"/>
  <text x="640" y="291" font-size="13" font-weight="800" fill="#14532d" text-anchor="start">32 s ⚡</text>
  <text x="665" y="328" font-size="13" font-weight="600" fill="#14532d" text-anchor="middle">2 × 3 = 6 jobs in parallel · fail-fast: false</text>
  <rect x="30" y="362" width="410" height="244" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
