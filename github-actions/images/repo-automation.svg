  <text x="155.0" y="173.1" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">New pull request</text>
  <text x="155.0" y="196.1" font-size="14" font-weight="400" fill="#1e3a8a" text-anchor="middle">opened</text>
  <path d="M284 179 L330 128 L374 128" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="380" y="106" width="490" height="44" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="625.0" y="133.25" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Post a welcome comment</text>
  <path d="M284 179 L330 180 L374 180" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="380" y="158" width="490" height="44" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="625.0" y="185.25" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Add labels based on changed files</text>
  <path d="M284 179 L330 232 L374 232" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="380" y="210" width="490" height="44" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="625.0" y="237.25" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Assign reviewers</text>
  <rect x="30" y="274" width="250" height="56" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="155.0" y="307.6" font-size="16" font-weight="700" fill="#7c2d12" text-anchor="middle">New issue opened</text>
  <path d="M284 302 L374 302" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="380" y="280" width="490" height="44" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="625.0" y="307.25" font-size="15" font-weight="700" fill="#7c2d12" text-anchor="middle">Label it / triage</text>
  <rect x="30" y="350" width="250" height="56" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="155.0" y="383.6" font-size="16" font-weight="700" fill="#14532d" text-anchor="middle">Release published</text>
  <path d="M284 378 L374 378" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="380" y="356" width="490" height="44" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="625.0" y="383.25" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">Publish the package</text>
  <rect x="30" y="418" width="840" height="40" rx="14" fill="#831843"/>
  <text x="450.0" y="444.5" font-size="18" font-weight="700" text-anchor="middle"><tspan fill="#ffffff">Event happens → </tspan><tspan fill="#fde047">workflow runs automatically</tspan></text>
