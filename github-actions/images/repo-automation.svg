<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="r" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
  <rect x="2" y="2" width="896" height="466" rx="18" fill="#ffffff" stroke="#db2777" stroke-width="3"/>
  <text x="450.0" y="54" font-size="30" font-weight="800" fill="#0f172a" text-anchor="middle">Not Just CI/CD — Automate Your Repo</text>
  <text x="155" y="92" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">When this happens…</text>
  <text x="625" y="92" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">…the workflow does this</text>
