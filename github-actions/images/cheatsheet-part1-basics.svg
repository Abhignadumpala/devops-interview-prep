  <text x="104.0" y="438.0" font-size="13" font-weight="700" fill="#7c2d12" text-anchor="middle">Event</text>
  <text x="104.0" y="455.0" font-size="11" font-weight="400" fill="#7c2d12" text-anchor="middle">push, PR…</text>
  <path d="M162 441.0 L177 441.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
