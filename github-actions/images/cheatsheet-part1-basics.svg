  <text x="72" y="647" font-size="18" font-weight="800" fill="#fff" text-anchor="start">Workflow File</text>
  <rect x="46" y="672" width="378" height="180" rx="10" fill="#0f172a"/>
  <text x="60" y="694" font-size="12.5" font-family="Consolas, Menlo, monospace" xml:space="preserve" fill="#7dd3fc">name: CI</text>
  <text x="414" y="694" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="end" font-family="Consolas, Menlo, monospace" xml:space="preserve"># workflow name</text>
  <text x="60" y="715" font-size="12.5" font-family="Consolas, Menlo, monospace" xml:space="preserve" fill="#7dd3fc">on: push</text>
  <text x="414" y="715" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="end" font-family="Consolas, Menlo, monospace" xml:space="preserve"># event</text>
  <text x="60" y="736" font-size="12.5" font-family="Consolas, Menlo, monospace" xml:space="preserve" fill="#7dd3fc">jobs:</text>
  <text x="60" y="757" font-size="12.5" font-family="Consolas, Menlo, monospace" xml:space="preserve" fill="#7dd3fc">  build:</text>
  <text x="414" y="757" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="end" font-family="Consolas, Menlo, monospace" xml:space="preserve"># job</text>
  <text x="60" y="778" font-size="12.5" font-family="Consolas, Menlo, monospace" xml:space="preserve" fill="#7dd3fc">    runs-on: ubuntu-latest</text>
  <text x="414" y="778" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="end" font-family="Consolas, Menlo, monospace" xml:space="preserve"># runner</text>
  <text x="60" y="799" font-size="12.5" font-family="Consolas, Menlo, monospace" xml:space="preserve" fill="#7dd3fc">    steps:</text>
  <text x="60" y="820" font-size="12.5" font-family="Consolas, Menlo, monospace" xml:space="preserve" fill="#7dd3fc">      - uses: actions/checkout@v4</text>
  <text x="414" y="820" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="end" font-family="Consolas, Menlo, monospace" xml:space="preserve"># action</text>
  <text x="60" y="841" font-size="12.5" font-family="Consolas, Menlo, monospace" xml:space="preserve" fill="#7dd3fc">      - run: npm ci</text>
  <text x="414" y="841" font-size="12" font-weight="400" fill="#94a3b8" text-anchor="end" font-family="Consolas, Menlo, monospace" xml:space="preserve"># command</text>
  <rect x="460" y="620" width="410" height="244" rx="14" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
  <path d="M460 660 V634 Q460 620 474 620 H856 Q870 620 870 634 V660 Z" fill="#0d9488"/>
  <circle cx="482" cy="640" r="12" fill="#ffffff"/>
  <text x="482" y="645" font-size="14" font-weight="800" fill="#0d9488" text-anchor="middle">6</text>
  <text x="502" y="647" font-size="18" font-weight="800" fill="#fff" text-anchor="start">Runners — where jobs run</text>
  <rect x="476" y="672" width="184" height="180" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <rect x="476" y="672" width="184" height="30" rx="10" fill="#2563eb"/>
  <text x="568" y="692" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">GitHub-hosted</text>
  <text x="486" y="728" font-size="12.5" font-weight="400" fill="#1e3a8a" text-anchor="start">• Ubuntu / Windows / macOS</text>
  <text x="486" y="754" font-size="12.5" font-weight="400" fill="#1e3a8a" text-anchor="start">• Fresh VM every job</text>
  <text x="486" y="780" font-size="12.5" font-weight="400" fill="#1e3a8a" text-anchor="start">• Tools pre-installed</text>
  <rect x="486" y="810" width="164" height="28" rx="6" fill="#1e293b"/>
  <text x="568" y="829" font-size="11.5" font-weight="400" fill="#86efac" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">runs-on: ubuntu-latest</text>
  <rect x="670" y="672" width="184" height="180" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="670" y="672" width="184" height="30" rx="10" fill="#16a34a"/>
  <text x="762" y="692" font-size="14" font-weight="800" fill="#fff" text-anchor="middle">Self-hosted</text>
  <text x="680" y="728" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="start">• Your server / EC2</text>
  <text x="680" y="754" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="start">• Keeps files between jobs</text>
  <text x="680" y="780" font-size="12.5" font-weight="400" fill="#14532d" text-anchor="start">• Install tools yourself</text>
  <rect x="680" y="810" width="164" height="28" rx="6" fill="#1e293b"/>
  <text x="762" y="829" font-size="11.5" font-weight="400" fill="#86efac" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">runs-on: self-hosted</text>
  <rect x="30" y="878" width="840" height="46" rx="14" fill="#1e3a8a"/>
  <text x="450.0" y="907.5" font-size="18" font-weight="700" text-anchor="middle"><tspan fill="#fdba74">Event</tspan><tspan fill="#ffffff"> triggers a </tspan><tspan fill="#c4b5fd">workflow</tspan><tspan fill="#ffffff"> → </tspan><tspan fill="#fde047">jobs</tspan><tspan fill="#ffffff"> run on </tspan><tspan fill="#67e8f9">runners</tspan><tspan fill="#ffffff"> → </tspan><tspan fill="#86efac">steps</tspan><tspan fill="#ffffff"> run in order</tspan></text>
