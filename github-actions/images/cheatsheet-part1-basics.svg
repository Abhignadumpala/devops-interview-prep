  <text x="72" y="131" font-size="18" font-weight="800" fill="#fff" text-anchor="start">What is GitHub Actions?</text>
  <text x="235" y="176" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">A CI/CD and automation platform</text>
  <text x="235" y="198" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">built into GitHub.</text>
  <rect x="48" y="220" width="112" height="48" rx="10" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="104.0" y="241.0" font-size="15" font-weight="700" fill="#7c2d12" text-anchor="middle">Event</text>
  <text x="104.0" y="258.0" font-size="11" font-weight="400" fill="#7c2d12" text-anchor="middle">push, PR…</text>
  <path d="M162 244 L177 244" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="181" y="220" width="112" height="48" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="237.0" y="241.0" font-size="15" font-weight="700" fill="#4c1d95" text-anchor="middle">Workflow</text>
  <text x="237.0" y="258.0" font-size="11" font-weight="400" fill="#4c1d95" text-anchor="middle">auto-triggers</text>
  <path d="M295 244 L310 244" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="314" y="220" width="112" height="48" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="370.0" y="241.0" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">Jobs run</text>
  <text x="370.0" y="258.0" font-size="11" font-weight="400" fill="#14532d" text-anchor="middle">build, test…</text>
  <text x="235" y="300" font-size="14" font-weight="400" fill="#1e3a8a" text-anchor="middle">Any event in the repo triggers the</text>
  <text x="235" y="320" font-size="14" font-weight="400" fill="#1e3a8a" text-anchor="middle">workflow automatically — no manual start.</text>
  <rect x="460" y="104" width="410" height="244" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <path d="M460 144 V118 Q460 104 474 104 H856 Q870 104 870 118 V144 Z" fill="#dc2626"/>
  <circle cx="482" cy="124" r="12" fill="#ffffff"/>
  <text x="482" y="129" font-size="14" font-weight="800" fill="#dc2626" text-anchor="middle">2</text>
  <text x="502" y="131" font-size="18" font-weight="800" fill="#fff" text-anchor="start">GitHub Actions vs Jenkins</text>
  <rect x="476" y="158" width="184" height="30" rx="10" fill="#2563eb" stroke="#2563eb" stroke-width="1.5"/>
  <text x="568.0" y="177.9" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">GitHub Actions</text>
  <text x="484" y="216" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="start">✔  Built into GitHub</text>
  <text x="484" y="246" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="start">✔  YAML in the repo</text>
  <text x="484" y="276" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="start">✔  Hosted runners</text>
  <text x="484" y="306" font-size="14" font-weight="600" fill="#1e3a8a" text-anchor="start">✔  Low maintenance</text>
  <rect x="670" y="158" width="184" height="30" rx="10" fill="#dc2626" stroke="#dc2626" stroke-width="1.5"/>
  <text x="762.0" y="177.9" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Jenkins</text>
  <text x="678" y="216" font-size="14" font-weight="600" fill="#7f1d1d" text-anchor="start">⚙  Your own server</text>
  <text x="678" y="246" font-size="14" font-weight="600" fill="#7f1d1d" text-anchor="start">⚙  Groovy Jenkinsfile</text>
  <text x="678" y="276" font-size="14" font-weight="600" fill="#7f1d1d" text-anchor="start">⚙  You add agents</text>
  <text x="678" y="306" font-size="14" font-weight="600" fill="#7f1d1d" text-anchor="start">⚙  High maintenance</text>
  <line x1="665" y1="196" x2="665" y2="332" stroke="#fecaca" stroke-width="2"/>
