  <text x="370.0" y="539.0" font-size="11" font-weight="400" fill="#164e63" text-anchor="middle">the machine</text>
  <path d="M312 525.0 L297 525.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="181" y="502" width="112" height="46" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="237.0" y="522.0" font-size="13" font-weight="700" fill="#14532d" text-anchor="middle">Steps</text>
  <text x="237.0" y="539.0" font-size="11" font-weight="400" fill="#14532d" text-anchor="middle">run in order</text>
  <path d="M179 525.0 L164 525.0" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="48" y="502" width="112" height="46" rx="10" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="104.0" y="522.0" font-size="13" font-weight="700" fill="#713f12" text-anchor="middle">Actions</text>
  <text x="104.0" y="539.0" font-size="11" font-weight="400" fill="#713f12" text-anchor="middle">reusable steps</text>
  <text x="235" y="590" font-size="13" font-weight="700" fill="#4c1d95" text-anchor="middle">Event → Workflow → Jobs → Runner → Steps</text>
