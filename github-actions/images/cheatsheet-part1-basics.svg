  <rect x="2" y="2" width="896" height="936" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="450" y="50" font-size="30" font-weight="800" text-anchor="middle"><tspan fill="#2563eb">GitHub Actions</tspan><tspan fill="#0f172a"> Cheat Sheet</tspan></text>
  <text x="450" y="80" font-size="17" font-weight="700" fill="#64748b" text-anchor="middle">Part 1 — Basics</text>
  <rect x="30" y="104" width="410" height="244" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
