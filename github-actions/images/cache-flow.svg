<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="r" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
  <rect x="2" y="2" width="896" height="526" rx="18" fill="#ffffff" stroke="#0891b2" stroke-width="3"/>
  <text x="450.0" y="54" font-size="30" font-weight="800" fill="#0f172a" text-anchor="middle">Caching — Faster Builds</text>
  <rect x="250" y="72" width="400" height="30" rx="15" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="450" y="92" font-size="13" text-anchor="middle" fill="#164e63"><tspan font-weight="700">key</tspan> = <tspan font-family="Consolas, Menlo, monospace">OS + hash(package-lock.json)</tspan></text>
  <rect x="30" y="114" width="840" height="110" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <rect x="46" y="122" width="190" height="26" rx="13" fill="#dc2626"/>
  <text x="141" y="140" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Run 1 — cache miss</text>
  <rect x="46" y="158" width="190" height="54" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="141" y="180" font-size="15" font-weight="700" fill="#7f1d1d" text-anchor="middle">1. Look for cache</text>
  <text x="141" y="201" font-size="13" font-weight="400" fill="#7f1d1d" text-anchor="middle">by key</text>
  <path d="M238 185 L254 185" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="258" y="158" width="190" height="54" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="353" y="180" font-size="15" font-weight="700" fill="#7f1d1d" text-anchor="middle">2. Cache miss  ❌</text>
  <text x="353" y="201" font-size="13" font-weight="400" fill="#7f1d1d" text-anchor="middle">no cache yet</text>
  <path d="M450 185 L466 185" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="470" y="158" width="190" height="54" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="565" y="180" font-size="15" font-weight="700" fill="#7f1d1d" text-anchor="middle">3. npm ci</text>
  <text x="565" y="201" font-size="13" font-weight="400" fill="#7f1d1d" text-anchor="middle">downloads all (slow)</text>
  <path d="M662 185 L678 185" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="682" y="158" width="190" height="54" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="777" y="180" font-size="15" font-weight="700" fill="#7f1d1d" text-anchor="middle">4. Save cache</text>
  <text x="777" y="201" font-size="13" font-weight="400" fill="#7f1d1d" text-anchor="middle">~/.npm → storage</text>
  <rect x="30" y="324" width="840" height="110" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="46" y="332" width="190" height="26" rx="13" fill="#16a34a"/>
  <text x="141" y="350" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Run 2 — cache hit</text>
  <rect x="46" y="368" width="190" height="54" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="141" y="390" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">1. Look for cache</text>
  <text x="141" y="411" font-size="13" font-weight="400" fill="#14532d" text-anchor="middle">same key</text>
  <path d="M238 395 L254 395" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="258" y="368" width="190" height="54" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="353" y="390" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">2. Cache hit  ✅</text>
  <text x="353" y="411" font-size="13" font-weight="400" fill="#14532d" text-anchor="middle">key found</text>
  <path d="M450 395 L466 395" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="470" y="368" width="190" height="54" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="565" y="390" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">3. Restore ~/.npm</text>
  <text x="565" y="411" font-size="13" font-weight="400" fill="#14532d" text-anchor="middle">from storage</text>
  <path d="M662 395 L678 395" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="682" y="368" width="190" height="54" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text x="777" y="390" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">4. npm ci</text>
  <text x="777" y="411" font-size="13" font-weight="400" fill="#14532d" text-anchor="middle">installs from cache (fast)</text>
  <path d="M778 214 L778 266 L594 266" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="310" y="240" width="280" height="56" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="450" y="263" font-size="15" font-weight="800" fill="#713f12" text-anchor="middle">GitHub cache storage</text>
  <text x="450" y="284" font-size="13" font-weight="400" fill="#713f12" text-anchor="middle" font-family="Consolas, Menlo, monospace" xml:space="preserve">~/.npm</text>
  <path d="M450 300 L450 312 L565 312 L565 362" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <text x="450" y="460" font-size="14" font-weight="600" fill="#334155" text-anchor="middle">package-lock.json changes → new key → cache miss → new cache saved</text>
  <rect x="30" y="474" width="840" height="44" rx="14" fill="#164e63"/>
  <text x="450.0" y="502.5" font-size="18" font-weight="700" text-anchor="middle"><tspan fill="#ffffff">Cache = </tspan><tspan fill="#fde047">speed</tspan><tspan fill="#ffffff">: reuse dependencies between runs</tspan></text>
</svg>
