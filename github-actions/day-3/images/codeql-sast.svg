<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="896" height="636" rx="18" fill="#ffffff" stroke="#dc2626" stroke-width="3"/>
  <text x="450" y="56" text-anchor="middle" font-size="34" font-weight="800" fill="#0f172a">CodeQL <tspan fill="#94a3b8">—</tspan> <tspan fill="#dc2626">SAST</tspan></text>

  <rect x="30" y="78" width="840" height="62" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="450" y="104" text-anchor="middle" font-size="17" fill="#450a0a"><tspan font-weight="700">SAST</tspan> (Static Application Security Testing) = an automated code review</text>
  <text x="450" y="127" text-anchor="middle" font-size="17" fill="#450a0a">that finds security issues in your code <tspan font-weight="700" fill="#dc2626">without running it</tspan>.</text>

  <!-- flow -->
  <rect x="60" y="160" width="210" height="56" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="165" y="194" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">Your source code</text>
  <line x1="274" y1="188" x2="338" y2="188" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="345" y="160" width="210" height="56" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="194" text-anchor="middle" font-size="17" font-weight="700" fill="#4c1d95">CodeQL scans it</text>
  <line x1="559" y1="188" x2="623" y2="188" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
  <rect x="630" y="160" width="210" height="56" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="735" y="194" text-anchor="middle" font-size="17" font-weight="700" fill="#7f1d1d">Alerts in Security tab</text>

  <text x="30" y="254" font-size="18" font-weight="700" fill="#0f172a">What it finds</text>
  <rect x="30" y="266" width="270" height="92" rx="12" fill="#fee2e2"/>
  <text x="50" y="296" font-size="17" font-weight="700" fill="#991b1b">SQL Injection</text>
  <text x="50" y="320" font-size="14" fill="#450a0a">User input goes straight</text>
  <text x="50" y="340" font-size="14" fill="#450a0a">into a database query</text>
  <rect x="315" y="266" width="270" height="92" rx="12" fill="#ffedd5"/>
  <text x="335" y="296" font-size="17" font-weight="700" fill="#9a3412">XSS</text>
  <text x="335" y="320" font-size="14" fill="#431407">User input shown on a web</text>
  <text x="335" y="340" font-size="14" fill="#431407">page without escaping</text>
  <rect x="600" y="266" width="270" height="92" rx="12" fill="#fce7f3"/>
  <text x="620" y="296" font-size="17" font-weight="700" fill="#9d174d">Command Injection</text>
  <text x="620" y="320" font-size="14" fill="#500724">User input passed into</text>
  <text x="620" y="340" font-size="14" fill="#500724">a shell command</text>

  <!-- testing vs codeql -->
  <rect x="30" y="380" width="410" height="180" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <rect x="30" y="380" width="410" height="44" rx="14" fill="#16a34a"/>
  <rect x="30" y="408" width="410" height="16" fill="#16a34a"/>
  <text x="235" y="409" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">Testing</text>
  <g font-size="16" fill="#14532d">
    <text x="55" y="456">✔ Checks functionality</text>
    <text x="55" y="482">✔ Finds bugs</text>
    <text x="55" y="508">✔ Runs the code</text>
    <text x="55" y="540" font-weight="700" font-size="18">"Does it work?"</text>
  </g>
  <rect x="460" y="380" width="410" height="180" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="460" y="380" width="410" height="44" rx="14" fill="#7c3aed"/>
  <rect x="460" y="408" width="410" height="16" fill="#7c3aed"/>
  <text x="665" y="409" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">CodeQL</text>
  <g font-size="16" fill="#4c1d95">
    <text x="485" y="456">✔ Checks security</text>
    <text x="485" y="482">✔ Finds vulnerabilities</text>
    <text x="485" y="508">✔ Reads the code (does not run it)</text>
    <text x="485" y="540" font-weight="700" font-size="18">"Is the code secure?"</text>
  </g>

  <rect x="30" y="578" width="840" height="46" rx="12" fill="#450a0a"/>
  <text x="245" y="608" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Testing → <tspan fill="#86efac">does it work?</tspan></text>
  <text x="655" y="608" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">CodeQL → <tspan fill="#fde047">is it secure?</tspan></text>
</svg>
