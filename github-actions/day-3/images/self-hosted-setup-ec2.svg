<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="896" height="496" rx="18" fill="#ffffff" stroke="#ea580c" stroke-width="3"/>
  <text x="450" y="54" text-anchor="middle" font-size="30" font-weight="800" fill="#0f172a">Set Up a Self-Hosted Runner on <tspan fill="#ea580c">AWS EC2</tspan></text>

  <!-- row 1 -->
  <rect x="30" y="80" width="250" height="160" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <circle cx="62" cy="112" r="18" fill="#ea580c"/><text x="62" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">1</text>
  <text x="90" y="119" font-size="19" font-weight="700" fill="#7c2d12">Launch EC2</text>
  <g font-size="14" fill="#431407">
    <text x="50" y="158">• Ubuntu</text>
    <text x="50" y="182">• t2.medium (2 vCPU, 4 GB RAM)</text>
    <text x="50" y="206">• Key pair + SSH port 22</text>
  </g>

  <line x1="284" y1="160" x2="316" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="325" y="80" width="250" height="160" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="357" cy="112" r="18" fill="#2563eb"/><text x="357" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">2</text>
  <text x="385" y="119" font-size="19" font-weight="700" fill="#1e3a8a">Connect</text>
  <g font-size="14" fill="#1e3a8a">
    <text x="345" y="158">SSH in as the ubuntu user:</text>
    <rect x="343" y="172" width="214" height="30" rx="6" fill="#1e293b"/>
    <text x="352" y="192" font-family="Consolas, Menlo, monospace" font-size="13" fill="#86efac">ssh -i key.pem ubuntu@&lt;ip&gt;</text>
  </g>

  <line x1="579" y1="160" x2="611" y2="160" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="620" y="80" width="250" height="160" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="652" cy="112" r="18" fill="#7c3aed"/><text x="652" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">3</text>
  <text x="680" y="119" font-size="19" font-weight="700" fill="#4c1d95">Download</text>
  <g font-family="Consolas, Menlo, monospace" font-size="13">
    <rect x="638" y="140" width="214" height="84" rx="6" fill="#1e293b"/>
    <text x="648" y="162" fill="#86efac">mkdir actions-runner</text>
    <text x="648" y="184" fill="#86efac">curl -o runner.tar.gz -L …</text>
    <text x="648" y="206" fill="#86efac">tar xzf runner.tar.gz</text>
  </g>

  <!-- turn arrow -->
  <path d="M745 244 L745 262 L155 262 L155 280" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- row 2 -->
  <rect x="30" y="288" width="250" height="160" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="62" cy="320" r="18" fill="#16a34a"/><text x="62" y="326" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">4</text>
  <text x="90" y="327" font-size="19" font-weight="700" fill="#14532d">Configure</text>
  <g font-size="14" fill="#14532d">
    <rect x="48" y="342" width="214" height="28" rx="6" fill="#1e293b"/>
    <text x="57" y="361" font-family="Consolas, Menlo, monospace" font-size="13" fill="#86efac">./config.sh --url --token</text>
    <text x="50" y="392">Group: Default  ·  Name: dev</text>
    <text x="50" y="414">Label: label1  ·  Work: _work</text>
  </g>

  <line x1="284" y1="368" x2="316" y2="368" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="325" y="288" width="250" height="160" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <circle cx="357" cy="320" r="18" fill="#0891b2"/><text x="357" y="326" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">5</text>
  <text x="385" y="327" font-size="19" font-weight="700" fill="#164e63">Run</text>
  <g font-size="14" fill="#164e63">
    <rect x="343" y="342" width="214" height="28" rx="6" fill="#1e293b"/>
    <text x="352" y="361" font-family="Consolas, Menlo, monospace" font-size="13" fill="#86efac">./run.sh</text>
    <text x="345" y="392">"Listening for Jobs"</text>
    <text x="345" y="414">Runner shows <tspan font-weight="700" fill="#16a34a">Idle</tspan> in GitHub</text>
  </g>

  <line x1="579" y1="368" x2="611" y2="368" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>

  <rect x="620" y="288" width="250" height="160" rx="14" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <circle cx="652" cy="320" r="18" fill="#ca8a04"/><text x="652" y="326" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">6</text>
  <text x="680" y="327" font-size="19" font-weight="700" fill="#713f12">Use in workflow</text>
  <g font-size="14" fill="#713f12">
    <rect x="638" y="342" width="214" height="28" rx="6" fill="#1e293b"/>
    <text x="647" y="361" font-family="Consolas, Menlo, monospace" font-size="13" fill="#86efac">runs-on: self-hosted</text>
    <text x="640" y="392">Job runs on your EC2</text>
    <text x="640" y="414">Install Node with setup-node</text>
  </g>

  <text x="450" y="482" text-anchor="middle" font-size="15" fill="#475569">Get the commands + token from <tspan font-weight="700">Settings → Actions → Runners → New self-hosted runner</tspan></text>
</svg>
