<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="2" y="2" width="896" height="596" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="450" y="52" text-anchor="middle" font-size="28" font-weight="800" fill="#0f172a">How Parallel Builds Saved 22 Minutes</text>
  <text x="450" y="78" text-anchor="middle" font-size="14" fill="#64748b">Microservice pipeline · same jobs, only the order changed</text>

  <!-- BEFORE -->
  <text x="30" y="110" font-size="15" font-weight="800" fill="#991b1b">BEFORE — every job waits for the previous one (40 min)</text>
  <g font-size="11" font-weight="700" text-anchor="middle">
    <rect x="200" y="120" width="32" height="34" fill="#a5b4fc"/><text x="216" y="141" fill="#1e1b4b">lint</text>
    <rect x="232" y="120" width="96" height="34" fill="#93c5fd"/><text x="280" y="141" fill="#1e3a8a">unit 6m</text>
    <rect x="328" y="120" width="224" height="34" fill="#fdba74"/><text x="440" y="141" fill="#7c2d12">integration tests 14m</text>
    <rect x="552" y="120" width="128" height="34" fill="#c4b5fd"/><text x="616" y="141" fill="#4c1d95">security 8m</text>
    <rect x="680" y="120" width="96" height="34" fill="#5eead4"/><text x="728" y="141" fill="#134e4a">docker 6m</text>
    <rect x="776" y="120" width="64" height="34" fill="#f9a8d4"/><text x="808" y="141" fill="#831843">deploy 4m</text>
  </g>
  <text x="190" y="142" text-anchor="end" font-size="13" font-weight="700" fill="#991b1b">sequential</text>

  <!-- AFTER -->
  <text x="30" y="194" font-size="15" font-weight="800" fill="#14532d">AFTER — independent jobs in parallel, deploy uses needs: (18 min)</text>
  <g font-size="13" font-weight="700" fill="#334155" text-anchor="end">
    <text x="190" y="221">lint (2m)</text>
    <text x="190" y="253">unit tests (6m)</text>
    <text x="190" y="285">integration (14m)</text>
    <text x="190" y="317">security (8m)</text>
    <text x="190" y="349">docker build (6m)</text>
    <text x="190" y="381">deploy (4m)</text>
  </g>
  <rect x="200" y="204" width="32" height="26" rx="5" fill="#a5b4fc"/>
  <rect x="200" y="236" width="96" height="26" rx="5" fill="#93c5fd"/>
  <rect x="200" y="268" width="224" height="26" rx="5" fill="#fdba74"/>
  <rect x="200" y="300" width="128" height="26" rx="5" fill="#c4b5fd"/>
  <rect x="200" y="332" width="96" height="26" rx="5" fill="#5eead4"/>
  <line x1="424" y1="200" x2="424" y2="396" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="424" y="364" width="64" height="26" rx="5" fill="#f9a8d4"/>
  <text x="498" y="382" font-size="13" font-weight="700" fill="#14532d">needs: [all 5] → starts when the slowest finishes</text>
  <text x="440" y="270" font-size="13" fill="#14532d">All 5 jobs start together at minute 0</text>
  <text x="440" y="290" font-size="13" fill="#14532d">Pipeline time = slowest job (14m) + deploy (4m)</text>

  <!-- axis -->
  <line x1="200" y1="410" x2="840" y2="410" stroke="#94a3b8" stroke-width="1.5"/>
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <line x1="200" y1="405" x2="200" y2="415" stroke="#94a3b8"/><text x="200" y="430">0</text>
    <line x1="360" y1="405" x2="360" y2="415" stroke="#94a3b8"/><text x="360" y="430">10</text>
    <line x1="520" y1="405" x2="520" y2="415" stroke="#94a3b8"/><text x="520" y="430">20</text>
    <line x1="680" y1="405" x2="680" y2="415" stroke="#94a3b8"/><text x="680" y="430">30</text>
    <line x1="840" y1="405" x2="840" y2="415" stroke="#94a3b8"/><text x="840" y="430">40 min</text>
  </g>

  <!-- results -->
  <rect x="30" y="452" width="270" height="56" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="165" y="487" text-anchor="middle" font-size="19" font-weight="800" fill="#991b1b">Before: 40 min</text>
  <rect x="315" y="452" width="270" height="56" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="450" y="487" text-anchor="middle" font-size="19" font-weight="800" fill="#14532d">After: 18 min</text>
  <rect x="600" y="452" width="270" height="56" rx="12" fill="#16a34a"/>
  <text x="735" y="487" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff">Saved 22 min ⚡ (55%)</text>

  <rect x="30" y="526" width="840" height="52" rx="12" fill="#14532d"/>
  <text x="450" y="558" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">30 pushes a day × 22 min = <tspan fill="#fde047">~11 hours less waiting for developers, every day</tspan></text>
</svg>
