<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e6522c"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
</defs>
<rect width="1100" height="640" rx="20" fill="url(#bg)"/>
<text x="40" y="62" font-size="34" font-weight="800" fill="url(#t)">Prometheus Architecture</text>
<text x="42" y="92" font-size="16" fill="#cbd5e1">Pull metrics → store in TSDB → check rules → alert → visualise</text>

<!-- left: sources -->
<rect x="30" y="125" width="270" height="70" rx="12" fill="#fff" fill-opacity="0.06" stroke="#a78bfa"/>
<text x="48" y="153" font-size="17" font-weight="700" fill="#a78bfa">Short-lived jobs</text>
<text x="48" y="178" font-size="14" fill="#e2e8f0">backup.sh · cron · batch (≤ 15 s)</text>

<rect x="30" y="235" width="270" height="65" rx="12" fill="#fff" fill-opacity="0.06" stroke="#a78bfa"/>
<text x="48" y="262" font-size="17" font-weight="700" fill="#a78bfa">Pushgateway :9091</text>
<text x="48" y="285" font-size="14" fill="#e2e8f0">keeps pushed metrics</text>

<rect x="30" y="335" width="270" height="95" rx="12" fill="#fff" fill-opacity="0.06" stroke="#10b981"/>
<text x="48" y="362" font-size="17" font-weight="700" fill="#10b981">Targets / Exporters</text>
<text x="48" y="386" font-size="14" fill="#e2e8f0">Node Exporter :9100</text>
<text x="48" y="408" font-size="14" fill="#e2e8f0">worker1 · worker2 · worker3</text>

<rect x="30" y="465" width="270" height="75" rx="12" fill="#fff" fill-opacity="0.06" stroke="#06b6d4"/>
<text x="48" y="493" font-size="17" font-weight="700" fill="#06b6d4">Service Discovery</text>
<text x="48" y="517" font-size="14" fill="#e2e8f0">EC2 / Kubernetes (IAM role)</text>

<line x1="165" y1="195" x2="165" y2="233" stroke="#cbd5e1" stroke-width="2" marker-end="url(#a)"/>
<text x="175" y="220" font-size="13" fill="#cbd5e1">push</text>

<!-- center: Prometheus server -->
<rect x="380" y="125" width="340" height="415" rx="16" fill="#e6522c" fill-opacity="0.10" stroke="#e6522c" stroke-width="2"/>
<text x="550" y="155" font-size="19" font-weight="800" fill="#f59e0b" text-anchor="middle">Prometheus Server :9090</text>
<rect x="405" y="172" width="290" height="62" rx="10" fill="#0f172a" fill-opacity="0.6" stroke="#f59e0b" stroke-opacity="0.6"/>
<text x="550" y="198" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="middle">Retrieval</text>
<text x="550" y="220" font-size="13" fill="#cbd5e1" text-anchor="middle">pulls metrics every scrape_interval</text>
<rect x="405" y="250" width="290" height="62" rx="10" fill="#0f172a" fill-opacity="0.6" stroke="#f59e0b" stroke-opacity="0.6"/>
<text x="550" y="276" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="middle">Rules</text>
<text x="550" y="298" font-size="13" fill="#cbd5e1" text-anchor="middle">CPU &gt; 50% for 1m → fire</text>
<rect x="405" y="328" width="290" height="62" rx="10" fill="#0f172a" fill-opacity="0.6" stroke="#f59e0b" stroke-opacity="0.6"/>
<text x="550" y="354" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="middle">TSDB</text>
<text x="550" y="376" font-size="13" fill="#cbd5e1" text-anchor="middle">time series stored on disk</text>
<rect x="405" y="406" width="290" height="62" rx="10" fill="#0f172a" fill-opacity="0.6" stroke="#f59e0b" stroke-opacity="0.6"/>
<text x="550" y="432" font-size="16" font-weight="700" fill="#f1f5f9" text-anchor="middle">HTTP Server</text>
<text x="550" y="454" font-size="13" fill="#cbd5e1" text-anchor="middle">answers PromQL queries</text>
<text x="550" y="505" font-size="13" fill="#cbd5e1" text-anchor="middle">config: /etc/prometheus/prometheus.yml</text>

<line x1="302" y1="267" x2="403" y2="205" stroke="#cbd5e1" stroke-width="2" marker-end="url(#a)"/>
<line x1="302" y1="382" x2="403" y2="212" stroke="#cbd5e1" stroke-width="2" marker-end="url(#a)"/>
<text x="320" y="300" font-size="13" fill="#cbd5e1">pull</text>
<line x1="302" y1="502" x2="403" y2="220" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="318" y="480" font-size="13" fill="#06b6d4">find targets</text>

<!-- right: alerting -->
<rect x="800" y="125" width="270" height="75" rx="12" fill="#fff" fill-opacity="0.06" stroke="#ef4444"/>
<text x="818" y="155" font-size="17" font-weight="700" fill="#ef4444">Alertmanager :9093</text>
<text x="818" y="180" font-size="14" fill="#e2e8f0">group · route · send</text>
<rect x="800" y="240" width="270" height="65" rx="12" fill="#fff" fill-opacity="0.06" stroke="#ef4444" stroke-opacity="0.6"/>
<text x="818" y="268" font-size="16" font-weight="700" fill="#f1f5f9">Notifications</text>
<text x="818" y="290" font-size="14" fill="#e2e8f0">Email · Slack · PagerDuty</text>
<line x1="697" y1="281" x2="798" y2="170" stroke="#ef4444" stroke-width="2" marker-end="url(#a)"/>
<text x="722" y="212" font-size="13" fill="#ef4444">alerts</text>
<line x1="935" y1="200" x2="935" y2="238" stroke="#ef4444" stroke-width="2" marker-end="url(#a)"/>

<!-- right: visualise -->
<rect x="800" y="360" width="270" height="70" rx="12" fill="#fff" fill-opacity="0.06" stroke="#f59e0b"/>
<text x="818" y="388" font-size="17" font-weight="700" fill="#f59e0b">Grafana :3000</text>
<text x="818" y="412" font-size="14" fill="#e2e8f0">dashboards (data source)</text>
<rect x="800" y="455" width="270" height="70" rx="12" fill="#fff" fill-opacity="0.06" stroke="#f59e0b" stroke-opacity="0.6"/>
<text x="818" y="483" font-size="17" font-weight="700" fill="#f1f5f9">Prometheus UI / API</text>
<text x="818" y="507" font-size="14" fill="#e2e8f0">Graph · Targets · Alerts</text>
<line x1="798" y1="395" x2="697" y2="437" stroke="#f59e0b" stroke-width="2" marker-start="url(#a)"/>
<line x1="798" y1="490" x2="697" y2="445" stroke="#f59e0b" stroke-width="2" marker-start="url(#a)"/>
<text x="722" y="400" font-size="13" fill="#f59e0b">PromQL</text>

<text x="550" y="600" font-size="15" fill="#cbd5e1" text-anchor="middle">Exporters &amp; Pushgateway → pulled by Prometheus → TSDB → Rules fire → Alertmanager → Email/Slack · Grafana queries with PromQL</text>
</svg>
