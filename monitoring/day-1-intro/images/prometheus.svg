<svg xmlns="http://www.w3.org/2000/svg" width="960" height="692" viewBox="0 0 960 692" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e1b4b"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e6522c"/><stop offset="1" stop-color="#f59e0b"/></linearGradient></defs>
<rect width="960" height="692" rx="20" fill="url(#bg)"/>
<circle cx="70" cy="62" r="30" fill="url(#t)"/><text x="70" y="74" font-size="32" text-anchor="middle" fill="#fff">🔥</text>
<text x="120" y="75" font-size="38" font-weight="800" fill="url(#t)">What is Prometheus?</text>
<text x="122" y="104" font-size="16" fill="#cbd5e1">Collects &amp; stores server metrics, queries them, and alerts when things go wrong</text>
<rect x="30" y="130" width="900" height="48" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#e6522c" stroke-opacity="0.6"/>
<rect x="30" y="130" width="8" height="48" rx="4" fill="#e6522c"/>
<text x="58" y="162" font-size="22">🏷️</text>
<text x="96" y="161" font-size="19" font-weight="700" fill="#e6522c">Name</text>
<text x="290" y="161" font-size="19" fill="#f1f5f9">Prometheus</text>
<rect x="30" y="188" width="900" height="48" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#f59e0b" stroke-opacity="0.6"/>
<rect x="30" y="188" width="8" height="48" rx="4" fill="#f59e0b"/>
<text x="58" y="220" font-size="22">🆓</text>
<text x="96" y="219" font-size="19" font-weight="700" fill="#f59e0b">Type</text>
<text x="290" y="219" font-size="19" fill="#f1f5f9">Free &amp; open source</text>
<rect x="30" y="246" width="900" height="48" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#10b981" stroke-opacity="0.6"/>
<rect x="30" y="246" width="8" height="48" rx="4" fill="#10b981"/>
<text x="58" y="278" font-size="22">☁️</text>
<text x="96" y="277" font-size="19" font-weight="700" fill="#10b981">Mainly for</text>
<text x="290" y="277" font-size="19" fill="#f1f5f9">Cloud-native applications</text>
<rect x="30" y="304" width="900" height="48" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#06b6d4" stroke-opacity="0.6"/>
<rect x="30" y="304" width="8" height="48" rx="4" fill="#06b6d4"/>
<text x="58" y="336" font-size="22">🎯</text>
<text x="96" y="335" font-size="19" font-weight="700" fill="#06b6d4">Purpose</text>
<text x="290" y="335" font-size="19" fill="#f1f5f9">Monitor servers</text>
<rect x="30" y="362" width="900" height="48" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#3b82f6" stroke-opacity="0.6"/>
<rect x="30" y="362" width="8" height="48" rx="4" fill="#3b82f6"/>
<text x="58" y="394" font-size="22">📊</text>
<text x="96" y="393" font-size="19" font-weight="700" fill="#3b82f6">Monitors</text>
<text x="290" y="393" font-size="19" fill="#f1f5f9">Metrics — CPU, RAM, disk… (anything in numbers)</text>
<rect x="30" y="420" width="900" height="48" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#8b5cf6" stroke-opacity="0.6"/>
<rect x="30" y="420" width="8" height="48" rx="4" fill="#8b5cf6"/>
<text x="58" y="452" font-size="22">🗄️</text>
<text x="96" y="451" font-size="19" font-weight="700" fill="#8b5cf6">Stores data in</text>
<text x="290" y="451" font-size="19" fill="#f1f5f9">TSDB — Time Series Database</text>
<rect x="30" y="478" width="900" height="48" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ec4899" stroke-opacity="0.6"/>
<rect x="30" y="478" width="8" height="48" rx="4" fill="#ec4899"/>
<text x="58" y="510" font-size="22">🔎</text>
<text x="96" y="509" font-size="19" font-weight="700" fill="#ec4899">To show data</text>
<text x="290" y="509" font-size="19" fill="#f1f5f9">PromQL — Prometheus Query Language</text>
<rect x="30" y="536" width="900" height="48" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ef4444" stroke-opacity="0.6"/>
<rect x="30" y="536" width="8" height="48" rx="4" fill="#ef4444"/>
<text x="58" y="568" font-size="22">🚨</text>
<text x="96" y="567" font-size="19" font-weight="700" fill="#ef4444">Alerts</text>
<text x="290" y="567" font-size="19" fill="#f1f5f9">Alertmanager → Email · Mobile · Slack (e.g. CPU &gt; 90%)</text>
<rect x="30" y="594" width="900" height="48" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#14b8a6" stroke-opacity="0.6"/>
<rect x="30" y="594" width="8" height="48" rx="4" fill="#14b8a6"/>
<text x="58" y="626" font-size="22">🔌</text>
<text x="96" y="625" font-size="19" font-weight="700" fill="#14b8a6">Port</text>
<text x="290" y="625" font-size="19" fill="#f1f5f9">9090</text>
</svg>