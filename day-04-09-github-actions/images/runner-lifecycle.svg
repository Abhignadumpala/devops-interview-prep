<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="r" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
  <rect x="2" y="2" width="896" height="426" rx="18" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>
  <text x="450.0" y="54" font-size="30" font-weight="800" fill="#0f172a" text-anchor="middle">What Happens to the Runner Machine?</text>
  <rect x="30" y="84" width="840" height="124" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <path d="M30 128 V98 Q30 84 44 84 H856 Q870 84 870 98 V128 Z" fill="#2563eb"/>
  <text x="450.0" y="113" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">GitHub-hosted</text>
  <rect x="55" y="144" width="240" height="48" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="175.0" y="173.25" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">GitHub's cloud</text>
  <path d="M299 168 L325 168" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="330" y="144" width="240" height="48" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="450.0" y="173.25" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">New clean VM every job</text>
  <path d="M574 168 L600 168" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="605" y="144" width="240" height="48" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="725.0" y="173.25" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Deleted after the job</text>
  <rect x="30" y="226" width="840" height="124" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <path d="M30 270 V240 Q30 226 44 226 H856 Q870 226 870 240 V270 Z" fill="#16a34a"/>
  <text x="450.0" y="255" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Self-hosted</text>
  <rect x="55" y="286" width="240" height="48" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="175.0" y="315.25" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">Your own server</text>
  <path d="M299 310 L325 310" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="330" y="286" width="240" height="48" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="450.0" y="315.25" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">Same machine every job</text>
  <path d="M574 310 L600 310" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="605" y="286" width="240" height="48" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="725.0" y="315.25" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">Files and caches stay</text>
  <rect x="30" y="370" width="840" height="44" rx="14" fill="#134e4a"/>
  <text x="450.0" y="398.5" font-size="18" font-weight="700" text-anchor="middle"><tspan fill="#ffffff">GitHub-hosted = </tspan><tspan fill="#93c5fd">clean every time</tspan><tspan fill="#ffffff">  ·  Self-hosted = </tspan><tspan fill="#86efac">keeps its files</tspan></text>
</svg>
