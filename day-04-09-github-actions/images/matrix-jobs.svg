<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="r" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
  <rect x="2" y="2" width="896" height="546" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="3"/>
  <text x="450.0" y="54" font-size="30" font-weight="800" fill="#0f172a" text-anchor="middle">Matrix Jobs — Same Job, Many Setups</text>
  <text x="180" y="98" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">You write the job once</text>
  <rect x="30" y="110" width="300" height="146" rx="8" fill="#1e293b"/>
  <text x="42" y="133" font-size="13" font-weight="400" fill="#86efac" text-anchor="start" font-family="Consolas, Menlo, monospace" xml:space="preserve">strategy:</text>
  <text x="42" y="155" font-size="13" font-weight="400" fill="#86efac" text-anchor="start" font-family="Consolas, Menlo, monospace" xml:space="preserve">  fail-fast: false</text>
  <text x="42" y="177" font-size="13" font-weight="400" fill="#86efac" text-anchor="start" font-family="Consolas, Menlo, monospace" xml:space="preserve">  matrix:</text>
  <text x="42" y="199" font-size="13" font-weight="400" fill="#86efac" text-anchor="start" font-family="Consolas, Menlo, monospace" xml:space="preserve">    os: [ubuntu-latest,</text>
  <text x="42" y="221" font-size="13" font-weight="400" fill="#86efac" text-anchor="start" font-family="Consolas, Menlo, monospace" xml:space="preserve">         windows-latest]</text>
  <text x="42" y="243" font-size="13" font-weight="400" fill="#86efac" text-anchor="start" font-family="Consolas, Menlo, monospace" xml:space="preserve">    node-version: [20, 22, 24]</text>
  <path d="M336 190 L398 190" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="367" y="180" font-size="13" font-weight="800" fill="#16a34a" text-anchor="middle">2 × 3</text>
  <text x="640" y="98" font-size="15" font-weight="700" fill="#64748b" text-anchor="middle">GitHub runs 6 jobs at the same time</text>
  <rect x="410" y="112" width="145" height="74" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="482.5" y="146.0" font-size="16" font-weight="700" fill="#7c2d12" text-anchor="middle">Ubuntu</text>
  <text x="482.5" y="166.0" font-size="13" font-weight="400" fill="#7c2d12" text-anchor="middle">Node 20  ✅</text>
  <rect x="567" y="112" width="145" height="74" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="639.5" y="146.0" font-size="16" font-weight="700" fill="#7c2d12" text-anchor="middle">Ubuntu</text>
  <text x="639.5" y="166.0" font-size="13" font-weight="400" fill="#7c2d12" text-anchor="middle">Node 22  ✅</text>
  <rect x="724" y="112" width="145" height="74" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="796.5" y="146.0" font-size="16" font-weight="700" fill="#7c2d12" text-anchor="middle">Ubuntu</text>
  <text x="796.5" y="166.0" font-size="13" font-weight="400" fill="#7c2d12" text-anchor="middle">Node 24  ✅</text>
  <rect x="410" y="198" width="145" height="74" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="482.5" y="232.0" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">Windows</text>
  <text x="482.5" y="252.0" font-size="13" font-weight="400" fill="#1e3a8a" text-anchor="middle">Node 20  ✅</text>
  <rect x="567" y="198" width="145" height="74" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="639.5" y="232.0" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">Windows</text>
  <text x="639.5" y="252.0" font-size="13" font-weight="400" fill="#1e3a8a" text-anchor="middle">Node 22  ✅</text>
  <rect x="724" y="198" width="145" height="74" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="796.5" y="232.0" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">Windows</text>
  <text x="796.5" y="252.0" font-size="13" font-weight="400" fill="#1e3a8a" text-anchor="middle">Node 24  ✅</text>
  <text x="30" y="316" font-size="16" font-weight="800" fill="#0f172a" text-anchor="start">Time (real numbers from my pipeline)</text>
  <text x="30" y="352" font-size="14" font-weight="700" fill="#7f1d1d" text-anchor="start">One after another</text>
  <rect x="200" y="334" width="600" height="28" rx="8" fill="#fca5a5"/>
  <text x="790" y="353" font-size="15" font-weight="800" fill="#7f1d1d" text-anchor="end">120 s</text>
  <text x="30" y="400" font-size="14" font-weight="700" fill="#14532d" text-anchor="start">Matrix (parallel)</text>
  <rect x="200" y="382" width="160" height="28" rx="8" fill="#4ade80"/>
  <text x="370" y="401" font-size="15" font-weight="800" fill="#14532d" text-anchor="start">32 s  ⚡</text>
  <text x="30" y="446" font-size="13" font-weight="400" fill="#334155" text-anchor="start">Total time = the slowest job, not all jobs added together.  fail-fast: false = one failure doesn’t stop the others.</text>
  <rect x="30" y="470" width="840" height="52" rx="14" fill="#14532d"/>
  <text x="450.0" y="502.5" font-size="18" font-weight="700" text-anchor="middle"><tspan fill="#ffffff">Write the job once → </tspan><tspan fill="#fde047">GitHub runs every combination in parallel</tspan></text>
</svg>
