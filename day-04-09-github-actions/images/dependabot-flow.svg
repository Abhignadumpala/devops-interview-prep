<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#64748b"/></marker><marker id="r" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker></defs>
  <rect x="2" y="2" width="896" height="516" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="450.0" y="54" font-size="30" font-weight="800" fill="#0f172a" text-anchor="middle">Dependabot — How It Works</text>
  <text x="450" y="86" font-size="16" text-anchor="middle" fill="#334155">Automatically checks dependencies for <tspan fill="#2563eb" font-weight="700">updates</tspan> and <tspan fill="#dc2626" font-weight="700">vulnerabilities</tspan>, and opens <tspan fill="#16a34a" font-weight="700">pull requests</tspan>.</text>
  <rect x="30" y="118" width="124" height="170" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <circle cx="92.0" cy="118" r="16" fill="#475569"/>
  <text x="92.0" y="123.5" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="92.0" y="160" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">Your</text>
  <text x="92.0" y="180" font-size="15" font-weight="800" fill="#0f172a" text-anchor="middle">project</text>
  <text x="92.0" y="214" font-size="13" font-weight="400" fill="#0f172a" text-anchor="middle">package.json</text>
  <text x="92.0" y="233" font-size="13" font-weight="400" fill="#0f172a" text-anchor="middle">lists the</text>
  <text x="92.0" y="252" font-size="13" font-weight="400" fill="#0f172a" text-anchor="middle">libraries</text>
  <path d="M155 203 L169 203" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="173" y="118" width="124" height="170" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <circle cx="235.0" cy="118" r="16" fill="#ca8a04"/>
  <text x="235.0" y="123.5" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="235.0" y="160" font-size="15" font-weight="800" fill="#713f12" text-anchor="middle">Uses a</text>
  <text x="235.0" y="180" font-size="15" font-weight="800" fill="#713f12" text-anchor="middle">dependency</text>
  <text x="235.0" y="214" font-size="13" font-weight="400" fill="#713f12" text-anchor="middle">e.g. Express</text>
  <text x="235.0" y="233" font-size="13" font-weight="400" fill="#713f12" text-anchor="middle">4.18</text>
  <path d="M298 203 L312 203" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="316" y="118" width="124" height="170" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="378.0" cy="118" r="16" fill="#2563eb"/>
  <text x="378.0" y="123.5" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="378.0" y="160" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">New version</text>
  <text x="378.0" y="180" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">released</text>
  <text x="378.0" y="214" font-size="13" font-weight="400" fill="#1e3a8a" text-anchor="middle">newer or</text>
  <text x="378.0" y="233" font-size="13" font-weight="400" fill="#1e3a8a" text-anchor="middle">more secure</text>
  <path d="M441 203 L455 203" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="459" y="118" width="124" height="170" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="521.0" cy="118" r="16" fill="#7c3aed"/>
  <text x="521.0" y="123.5" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="521.0" y="160" font-size="15" font-weight="800" fill="#4c1d95" text-anchor="middle">Dependabot</text>
  <text x="521.0" y="180" font-size="15" font-weight="800" fill="#4c1d95" text-anchor="middle">detects it</text>
  <text x="521.0" y="214" font-size="13" font-weight="400" fill="#4c1d95" text-anchor="middle">checks</text>
  <text x="521.0" y="233" font-size="13" font-weight="400" fill="#4c1d95" text-anchor="middle">weekly</text>
  <path d="M584 203 L598 203" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="602" y="118" width="124" height="170" rx="12" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <circle cx="664.0" cy="118" r="16" fill="#db2777"/>
  <text x="664.0" y="123.5" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">5</text>
  <text x="664.0" y="160" font-size="15" font-weight="800" fill="#831843" text-anchor="middle">Opens a</text>
  <text x="664.0" y="180" font-size="15" font-weight="800" fill="#831843" text-anchor="middle">pull request</text>
  <text x="664.0" y="214" font-size="13" font-weight="400" fill="#831843" text-anchor="middle">old → new</text>
  <text x="664.0" y="233" font-size="13" font-weight="400" fill="#831843" text-anchor="middle">version</text>
  <path d="M727 203 L741 203" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/>
  <rect x="745" y="118" width="124" height="170" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <circle cx="807.0" cy="118" r="16" fill="#16a34a"/>
  <text x="807.0" y="123.5" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">6</text>
  <text x="807.0" y="160" font-size="15" font-weight="800" fill="#14532d" text-anchor="middle">CI passes,</text>
  <text x="807.0" y="180" font-size="15" font-weight="800" fill="#14532d" text-anchor="middle">you merge</text>
  <text x="807.0" y="214" font-size="13" font-weight="400" fill="#14532d" text-anchor="middle">tests run on</text>
  <text x="807.0" y="233" font-size="13" font-weight="400" fill="#14532d" text-anchor="middle">the PR first</text>
  <rect x="30" y="310" width="840" height="52" rx="14" fill="#1e3a8a"/>
  <text x="450.0" y="342.5" font-size="18" font-weight="700" text-anchor="middle"><tspan fill="#ffffff">Dependabot = keeps dependencies </tspan><tspan fill="#93c5fd">updated</tspan><tspan fill="#ffffff"> and </tspan><tspan fill="#86efac">secure</tspan><tspan fill="#ffffff"> automatically</tspan></text>
  <text x="450" y="400" font-size="16" font-weight="800" fill="#1e3a8a" text-anchor="middle">Dependabot helps with</text>
  <rect x="30" y="418" width="200" height="70" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="130" y="447" font-size="16" font-weight="800" fill="#713f12" text-anchor="middle">Outdated</text>
  <text x="130" y="470" font-size="13" font-weight="400" fill="#713f12" text-anchor="middle">dependencies</text>
  <rect x="242" y="418" width="200" height="70" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="342" y="447" font-size="16" font-weight="800" fill="#7f1d1d" text-anchor="middle">Vulnerable</text>
  <text x="342" y="470" font-size="13" font-weight="400" fill="#7f1d1d" text-anchor="middle">dependencies</text>
  <rect x="454" y="418" width="200" height="70" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="554" y="447" font-size="16" font-weight="800" fill="#4c1d95" text-anchor="middle">Version updates</text>
  <text x="554" y="470" font-size="13" font-weight="400" fill="#4c1d95" text-anchor="middle" font-family="Consolas, Menlo, monospace">dependabot.yml</text>
  <rect x="666" y="418" width="200" height="70" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="766" y="447" font-size="16" font-weight="800" fill="#14532d" text-anchor="middle">Security updates</text>
  <text x="766" y="470" font-size="13" font-weight="400" fill="#14532d" text-anchor="middle">repo settings</text>
</svg>
