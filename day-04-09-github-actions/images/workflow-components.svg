  <text x="527" y="411" font-size="13" font-weight="400" fill="#86efac" text-anchor="start" font-family="Consolas, Menlo, monospace">1. uses: actions/checkout</text>
  <text x="527" y="433" font-size="13" font-weight="400" fill="#86efac" text-anchor="start" font-family="Consolas, Menlo, monospace">2. run: npm ci</text>
  <text x="527" y="455" font-size="13" font-weight="400" fill="#86efac" text-anchor="start" font-family="Consolas, Menlo, monospace">3. run: npm test</text>
